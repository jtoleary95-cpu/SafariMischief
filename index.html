/* ===================== geometry ===================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inRect = (x, y, r) => r && x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function pushOutRect(p, rad, r){
  const cx = clamp(p.x, r[0], r[0] + r[2]), cy = clamp(p.y, r[1], r[1] + r[3]); const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
  if(d >= rad) return false;
  if(d < .001){ const l = p.x - r[0], rr = r[0] + r[2] - p.x, t = p.y - r[1], b = r[1] + r[3] - p.y, m = Math.min(l, rr, t, b);
    if(m === l) p.x = r[0] - rad; else if(m === rr) p.x = r[0] + r[2] + rad; else if(m === t) p.y = r[1] - rad; else p.y = r[1] + r[3] + rad; return true; }
  p.x = cx + dx / d * rad; p.y = cy + dy / d * rad; return true;
}
function pushOutCircle(p, rad, cx, cy, cr){ const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || .01, m = rad + cr; if(d >= m) return false; p.x = cx + dx / d * m; p.y = cy + dy / d * m; return true; }
function collide(p, rad, A, objs){
  for(let k = 0; k < 2; k++){
    for(const w of A.walls) pushOutRect(p, rad, w);
    for(const t of A.trees) pushOutCircle(p, rad, t[0], t[1], t[2] * .7);
    for(const f of A.fixtures) if(f.solid) pushOutCircle(p, rad, f.x, f.y, f.r);
    if(objs) for(const o of objs) if(o.heavy && !o.gone) pushOutCircle(p, rad, o.x, o.y, o.r);
  }
  p.x = clamp(p.x, rad, AW - rad); p.y = clamp(p.y, rad, AH - rad);
}
const waterAt = (A, x, y) => { for(const w of A.water) if(w[4] !== "mud" && inRect(x, y, w)) return w[4]; return null; };
const headPos = (role, a) => { const L = role === "G" ? (a.s ? 64 : 34) : 30; return {x: a.x + Math.cos(a.d) * L, y: a.y + Math.sin(a.d) * L}; };
const RAD = {G: 18, H: 24};

/* ===================== pathfinding ===================== */
function buildGrid(A){
  const C = 20, gw = Math.ceil(AW / C), gh = Math.ceil(AH / C), g = new Uint8Array(gw * gh);
  for(let j = 0; j < gh; j++) for(let i = 0; i < gw; i++){
    const x = i * C + C / 2, y = j * C + C / 2; let b = 0;
    for(const w of A.walls) if(x > w[0] - 13 && x < w[0] + w[2] + 13 && y > w[1] - 13 && y < w[1] + w[3] + 13) b = 1;
    for(const t of A.trees) if(Math.hypot(x - t[0], y - t[1]) < t[2] * .7 + 12) b = 1;
    for(const f of A.fixtures) if(f.solid && Math.hypot(x - f.x, y - f.y) < f.r + 12) b = 1;
    for(const w of A.water) if(w[4] !== "mud" && inRect(x, y, w)) b = 1;
    g[j * gw + i] = b;
  }
  return {C, gw, gh, g};
}
function nearFree(G, i, j){
  if(i >= 0 && j >= 0 && i < G.gw && j < G.gh && !G.g[j * G.gw + i]) return [i, j];
  for(let r = 1; r < 12; r++) for(let dj = -r; dj <= r; dj++) for(let di = -r; di <= r; di++){
    const a = i + di, b = j + dj; if(a >= 0 && b >= 0 && a < G.gw && b < G.gh && !G.g[b * G.gw + a]) return [a, b]; }
  return [i, j];
}
function findPath(G, sx, sy, tx, ty){
  const C = G.C, [si, sj] = nearFree(G, Math.floor(sx / C), Math.floor(sy / C)), [ti, tj] = nearFree(G, Math.floor(tx / C), Math.floor(ty / C));
  const N = G.gw * G.gh, start = sj * G.gw + si, goal = tj * G.gw + ti;
  const gs = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N), open = [start]; gs[start] = 0;
  const h = k => Math.hypot(k % G.gw - ti, Math.floor(k / G.gw) - tj);
  let it = 0;
  while(open.length && it++ < 4000){
    let bi = 0, bf = 1e9; for(let q = 0; q < open.length; q++){ const f = gs[open[q]] + h(open[q]); if(f < bf){ bf = f; bi = q; } }
    const cur = open.splice(bi, 1)[0]; if(cur === goal) break; if(closed[cur]) continue; closed[cur] = 1;
    const ci = cur % G.gw, cj = Math.floor(cur / G.gw);
    for(let dj = -1; dj <= 1; dj++) for(let di = -1; di <= 1; di++){
      if(!di && !dj) continue; const a = ci + di, b = cj + dj; if(a < 0 || b < 0 || a >= G.gw || b >= G.gh) continue;
      const k = b * G.gw + a; if(G.g[k] || closed[k]) continue;
      if(di && dj && (G.g[cj * G.gw + a] || G.g[b * G.gw + ci])) continue;
      const ng = gs[cur] + (di && dj ? 1.414 : 1); if(ng < gs[k]){ gs[k] = ng; from[k] = cur; open.push(k); }
    }
  }
  if(from[goal] < 0 && goal !== start) return [{x: tx, y: ty}];
  const pts = []; for(let k = goal; k !== start && k >= 0; k = from[k]) pts.push({x: (k % G.gw) * C + C / 2, y: Math.floor(k / G.gw) * C + C / 2});
  pts.reverse(); const out = pts.filter((_, i) => i % 2 === 1 || i === pts.length - 1); out.push({x: tx, y: ty}); return out;
}

/* ===================== the host's world ===================== */
class World {
  constructor(ai, done){
    this.ai = ai; this.A = AREAS[ai]; this.G = buildGrid(this.A); this.t = 0; this.done = Object.assign({}, done || {});
    this.objs = this.A.objs.map(o => Object.assign({}, o, {home: [o.x, o.y], holder: "", gone: false}));
    this.npcs = this.A.npcs.map((n, i) => Object.assign({}, n, {home: [n.x, n.y], st: n.beh, dir: n.face ?? Math.PI / 2, path: null, tgt: null, timer: rnd(3) + i, wp: 0, vt: 0}));
    this.flag = {}; this.cnt = {}; this.events = []; this.eid = 0; this.P = {}; this.prev = {}; this.immune = {G: 0, H: 0};
    this.hStill = 0; this.stay = {}; this.lastCharge = -9; this.chk = 0;
    this.W = {inZ: (a, z) => this.inZ(a, z), ev: (k, f, s) => this.ev(k, f, s), npc: id => this.npc(id), o: id => this.o(id), flag: this.flag, cnt: this.cnt};
  }
  o(id){ return this.objs.find(o => o.id === id); }
  npc(id){ return this.npcs.find(n => n.id === id); }
  inZ(a, z){ const p = typeof a === "string" ? this.o(a) : a; if(!p || p.gone) return false; return inRect(p.x, p.y, this.A.zones[z]); }
  ev(k, f, s = 3){ return this.events.some(e => e.k === k && this.t - e.at <= s && (!f || f(e))); }
  emit(k, d){ const e = Object.assign({k, at: this.t, i: ++this.eid}, d); this.events.push(e); if(this.events.length > 30) this.events.shift(); return e; }
  held(role){ return this.objs.find(o => o.holder === role); }

  /* ---- player actions (role = "G" | "H") ---- */
  grab(role){
    const a = this.P[role]; if(!a) return;
    const h = this.held(role); if(h){ this.drop(role); return; }
    const hp = headPos(role, a); let best = null, bd = 1e9;
    for(const o of this.objs){ if(o.gone || o.heavy || (o.holder && !(o.attach && o.holder === ""))) continue;
      const pos = o.attach && !o.holder ? this.attachPos(o) : o; if(o.holder) continue;
      if(o.high && !(role === "G" && a.s)) continue;
      const d = Math.hypot(pos.x - hp.x, pos.y - hp.y); if(d < 46 + o.r && d < bd){ bd = d; best = o; } }
    for(const f of this.A.fixtures){ if(!f.high || this.flag["used_" + f.id] || !(role === "G" && a.s)) continue;
      const d = Math.hypot(f.x - hp.x, f.y - hp.y); if(d < 50 + f.r && d < bd){ bd = d; best = f; } }
    if(!best) return;
    if(this.A.fixtures.includes(best)){ this.flag["used_" + best.id] = 1; this.emit("grab", {who: role, obj: best.id, st: a.s ? 1 : 0}); this.onUse(best.id); return; }
    best.attach = null; best.holder = role; this.emit("grab", {who: role, obj: best.id, st: a.s ? 1 : 0});
    if(best.id === "cake"){ best.gone = true; best.holder = ""; }
  }
  drop(role){
    const o = this.held(role); if(!o) return; const a = this.P[role], hp = headPos(role, a);
    o.holder = ""; o.x = clamp(hp.x, 10, AW - 10); o.y = clamp(hp.y, 10, AH - 10);
    this.emit("drop", {who: role, obj: o.id, st: a.s ? 1 : 0});
    if(this.ai === 3 && o.id === "undies" && role === "G" && a.s && this.inZ(o, "flagZ")){ this.flag.flagged = 1; o.x = 140; o.y = 790; }
  }
  noise(role){
    const a = this.P[role]; if(!a) return; this.emit("noise", {who: role, x: a.x, y: a.y});
    for(const n of this.npcs){ if(["sit", "lounge", "photo", "trapped", "chase", "return", "dive", "gongsit"].includes(n.st)) continue;
      if(Math.hypot(n.x - a.x, n.y - a.y) < 280){ n.st = "investigate"; n.tgt = {x: a.x, y: a.y}; n.path = null; n.timer = 0; } }
    const g = this.npc("guard"), H = this.P.H;
    if(this.ai === 1 && role === "G" && g && H && this.inZ(H, "pool") && this.hStill > 1.2 && Math.hypot(g.x - a.x, g.y - a.y) < 320){ g.st = "dive"; g.tgt = {x: H.x, y: H.y}; }
    const tl = this.npc("teller"), G = this.P.G;
    if(this.ai === 3 && role === "H" && tl && G && Math.hypot(tl.x - a.x, tl.y - a.y) < 240 && Math.hypot(tl.x - G.x, tl.y - G.y) < 330){ this.flag.scared = 1; tl.st = "post"; tl.jump = this.t; }
    const mic = this.A.fixtures.find(f => f.id === "mic");
    if(this.ai === 5 && role === "H" && mic && Math.hypot(mic.x - a.x, mic.y - a.y) < 80){ this.flag.pa = 1; }
  }
  onUse(id){
    if(id === "gong") for(const n of this.npcs) if(n.gong){ n.st = "gongsit"; n.tgt = {x: n.gong[0], y: n.gong[1]}; n.path = null; }
    if(id === "bell"){ this.flag.bell = 1; for(const n of this.npcs){ n.st = "chase"; n.who = Math.random() < .5 ? "G" : "H"; n.until = this.t + 12; n.path = null; } }
  }
  attachPos(o){ const n = this.npc(o.attach); return n ? {x: n.x, y: n.y - 2} : o; }

  /* ---- simulation step ---- */
  tick(dt){
    this.t += dt; const A = this.A, G = this.P.G, H = this.P.H;
    for(const o of this.objs){
      if(o.attach && !o.holder){ const p = this.attachPos(o); o.x = p.x; o.y = p.y; }
      else if(o.holder === "G" || o.holder === "H"){ const a = this.P[o.holder]; if(a){ const hp = headPos(o.holder, a); o.x = hp.x; o.y = hp.y; } }
      else if(o.holder){ const n = this.npc(o.holder); if(n){ o.x = n.x; o.y = n.y - 6; } }
    }
    if(H){
      const pv = this.prev.H; const sp = pv ? Math.hypot(H.x - pv.x, H.y - pv.y) / dt : 0; this.hStill = sp < 25 ? this.hStill + dt : 0;
      if(H.c) this.lastCharge = this.t;
      for(const o of this.objs){ if(!o.heavy || o.gone) continue; const d = Math.hypot(o.x - H.x, o.y - H.y) || .01, m = RAD.H + o.r;
        if(d < m){ const push = (m - d) + (H.c ? 5 : 0); o.x += (o.x - H.x) / d * push; o.y += (o.y - H.y) / d * push;
          const q = {x: o.x, y: o.y}; for(const w of A.walls) pushOutRect(q, o.r, w); for(const t of A.trees) pushOutCircle(q, o.r, t[0], t[1], t[2] * .7);
          for(const f of A.fixtures) if(f.solid) pushOutCircle(q, o.r, f.x, f.y, f.r); o.x = clamp(q.x, o.r, AW - o.r); o.y = clamp(q.y, o.r, AH - o.r); } }
      const wNow = !!waterAt(A, H.x, H.y), wWas = !!this.prev.Hw;
      if(wNow && !wWas && this.t - this.lastCharge < .7) this.splash(H.x, H.y);
      this.prev.Hw = wNow;
      if(H.c && !this.prev.Hc) this.chargeStart = this.t;
      if(H.c) for(const f of A.fixtures) if(f.bump && Math.hypot(f.x - H.x, f.y - H.y) < f.r + 34 && this.bumped !== this.chargeStart){ this.bumped = this.chargeStart; this.emit("bump", {obj: f.id}); }
      this.prev.Hc = H.c;
    }
    for(const n of this.npcs) this.npcTick(n, dt);
    this.areaTick(dt);
    if(H) this.prev.H = {x: H.x, y: H.y};
    this.chk += dt; const fresh = [];
    if(this.chk > .2){ this.chk = 0; for(const p of A.pranks) if(!this.done[p.id]){ let ok = false; try{ ok = p.check(this.W); }catch{} if(ok){ this.done[p.id] = true; fresh.push(p.id); this.emit("prank", {obj: p.id}); } } }
    return fresh;
  }
  splash(x, y){
    this.emit("splash", {x, y});
    if(this.ai === 1 && this.inZ({x, y}, "pool")) for(const id of ["sun1", "sun2"]){ const n = this.npc(id); if(n && Math.hypot(n.x - x, n.y - y) < 240){ this.flag.soaked = 1; n.wet = this.t; } }
    const fire = this.A.fixtures.find(f => f.id === "fire"); if(this.ai === 3 && fire && Math.hypot(fire.x - x, fire.y - y) < 300) this.flag.fireOut = 1;
  }
  areaTick(dt){
    const G = this.P.G, H = this.P.H;
    if(this.ai === 0){ const k = this.npc("keeper"); if(k && this.inZ(k, "stock") && this.inZ("crate", "stockDoor")) k.st = "trapped"; }
    if(this.ai === 4){
      this.npcs.filter(n => n.beh === "photo").forEach((n, i) => {
        n.snapT = (n.snapT ?? i * 1.3) + dt; if(n.snapT < 4) return; n.snapT = 0; this.emit("flash", {x: n.x, y: n.y, obj: n.id});
        for(const r of ["G", "H"]){ const a = this.P[r]; if(!a) continue; const dx = a.x - n.x, dy = a.y - n.y, d = Math.hypot(dx, dy);
          let da = Math.atan2(dy, dx) - n.dir; da = Math.atan2(Math.sin(da), Math.cos(da));
          if(d < 160 && Math.abs(da) < .6){ this.cnt.photos = (this.cnt.photos || 0) + 1; this.emit("snap", {x: a.x, y: a.y, who: r}); break; } }
      });
      const j = this.o("jeep1");
      if(H && j && Math.hypot(H.x - j.x, H.y - (j.y + 34)) < 46 && this.hStill > 0){ this.stay.tire = (this.stay.tire || 0) + dt; if(this.stay.tire > 2.5) this.flag.flat = 1; } else this.stay.tire = 0;
      if(G && H && this.inZ(G, "jeepZ") && this.inZ(H, "jeepZ")){ this.stay.ride = (this.stay.ride || 0) + dt; if(this.stay.ride > 2) this.flag.ride = 1; } else this.stay.ride = 0;
    }
    if(this.ai === 5 && this.flag.bell && G && H && this.inZ(G, "escZ") && this.inZ(H, "escZ")) this.flag.escaped = 1;
  }

  /* ---- people ---- */
  goTo(n, tgt, speed, dt, swim){
    if(!tgt) return true; const d0 = Math.hypot(tgt.x - n.x, tgt.y - n.y); if(d0 < 8) return true;
    if(swim){ this.step(n, tgt, speed, dt, true); return false; }
    if(!n.path || n.repath <= this.t || n.ptgt !== tgt){ n.path = findPath(this.G, n.x, n.y, tgt.x, tgt.y); n.ptgt = tgt; n.repath = this.t + (n.st === "chase" ? .45 : 3); }
    while(n.path.length && Math.hypot(n.path[0].x - n.x, n.path[0].y - n.y) < 10) n.path.shift();
    const w = n.path[0] || tgt; this.step(n, w, speed, dt, false); return false;
  }
  step(n, w, speed, dt, swim){
    const dx = w.x - n.x, dy = w.y - n.y, d = Math.hypot(dx, dy) || 1, s = Math.min(d, speed * dt);
    n.x += dx / d * s; n.y += dy / d * s; n.dir = Math.atan2(dy, dx);
    if(!swim) collide(n, 14, this.A, this.objs); n.moving = this.t;
  }
  sees(n, a){ const dx = a.x - n.x, dy = a.y - n.y, d = Math.hypot(dx, dy); if(d > 220) return false; if(d < 85) return true;
    let da = Math.atan2(dy, dx) - n.dir; da = Math.atan2(Math.sin(da), Math.cos(da)); return Math.abs(da) < 1.25; }
  npcTick(n, dt){
    if(n.wet && this.t - n.wet < 4 && n.st === "lounge") n.angry = 1;
    if(["sit", "lounge", "photo", "trapped"].includes(n.st)) return;
    if(["post", "wander", "route", "investigate"].includes(n.st)){
      n.vt -= dt; if(n.vt <= 0){ n.vt = .25;
        for(const r of ["G", "H"]){ const a = this.P[r], o = this.held(r); if(!a || !o || o.own !== n.id || this.immune[r] > this.t) continue;
          if(this.sees(n, a)){ n.st = "chase"; n.who = r; n.until = this.t + 6; n.path = null; this.emit("spot", {obj: n.id}); break; } } }
    }
    const home = {x: n.home[0], y: n.home[1]};
    switch(n.st){
      case "post": if(this.goTo(n, home, NPC_WALK, dt)){ n.dir = n.face ?? n.dir; n.path = null; } break;
      case "wander": n.timer -= dt; if(!n.tgt || n.timer <= 0){ n.timer = 3 + Math.random() * 3; const a = Math.random() * 6.28, r = Math.random() * n.rad; n.tgt = {x: clamp(home.x + Math.cos(a) * r, 30, AW - 30), y: clamp(home.y + Math.sin(a) * r, 30, AH - 30)}; n.path = null; }
        this.goTo(n, n.tgt, NPC_WALK * .7, dt); break;
      case "route": { const w = n.route[n.wp % n.route.length], t = {x: w[0], y: w[1]}; if(n.rt !== n.wp){ n.rt = n.wp; n.rtg = t; n.path = null; } if(this.goTo(n, n.rtg, NPC_WALK, dt)) n.wp++; break; }
      case "investigate": if(this.goTo(n, n.tgt, NPC_WALK * 1.15, dt)){ n.timer += dt; n.dir += dt * 2.5; if(n.timer > 2.2){ n.st = n.beh; n.tgt = null; n.path = null; } } break;
      case "gongsit": if(this.goTo(n, n.tgt, NPC_WALK * 1.3, dt)){ n.st = "sit"; n.dir = -Math.PI / 2; } break;
      case "dive": this.step(n, n.tgt, NPC_CHASE, dt, true); if(this.inZ(n, "pool")){ this.flag.dived = 1; n.swimT = (n.swimT || 0) + dt; if(n.swimT > 2.5){ n.x = n.home[0]; n.y = n.home[1]; n.st = "post"; n.swimT = 0; } } break;
      case "chase": { const a = this.P[n.who]; if(!a || this.t > n.until || (!this.flag.bell && !this.held(n.who)) || Math.hypot(a.x - n.x, a.y - n.y) > 430){ n.st = n.beh === "sit" ? "post" : n.beh; n.path = null; break; }
        this.goTo(n, {x: a.x, y: a.y}, NPC_CHASE, dt, false);
        if(Math.hypot(a.x - n.x, a.y - n.y) < RAD[n.who] + 16 && this.immune[n.who] <= this.t) this.caught(n, n.who); break; }
      case "return": { const o = this.o(n.carry); if(!o){ n.st = n.beh; break; } const h = o.attach0 ? {x: n.x, y: n.y} : {x: o.home[0], y: o.home[1]};
        if(o.id === "chefhat" || this.goTo(n, h, NPC_WALK, dt)){ o.holder = ""; if(o.id === "chefhat") o.attach = "chef"; else { o.x = o.home[0]; o.y = o.home[1]; } n.carry = null; n.st = n.beh === "sit" ? "post" : n.beh; n.path = null; } break; }
    }
    if(n.st === "post" && n.beh === "sit") { n.st = "sit"; }
  }
  caught(n, role){
    const a = this.P[role]; const dx = a.x - n.x, dy = a.y - n.y, d = Math.hypot(dx, dy) || 1;
    this.immune[role] = this.t + 2.2; this.emit("bonk", {who: role, x: dx / d, y: dy / d, obj: n.id});
    const o = this.held(role);
    if(o){ o.holder = n.id; n.carry = o.id; n.st = "return"; n.path = null; } else if(!this.flag.bell){ n.st = n.beh; n.path = null; }
  }

  /* ---- what the partner's phone needs to draw ---- */
  snap(){
    const r1 = v => Math.round(v);
    const o = {}; for(const x of this.objs) o[x.id] = [r1(x.x), r1(x.y), x.holder || "", x.gone ? 1 : 0];
    const n = {}; for(const x of this.npcs) n[x.id] = [r1(x.x), r1(x.y), x.st, Math.round(x.dir * 100), x.angry && this.t - (x.wet || -9) < 4 ? 1 : 0, x.jump && this.t - x.jump < 1.5 ? 1 : 0];
    return {a: this.ai, o, n, f: Object.assign({}, this.flag), c: Object.assign({}, this.cnt), e: this.events.slice(-14).map(e => ({i: e.i, k: e.k, who: e.who || "", obj: e.obj || "", x: e.x != null ? r1(e.x * (e.k === "bonk" ? 100 : 1)) : 0, y: e.y != null ? r1(e.y * (e.k === "bonk" ? 100 : 1)) : 0}))};
  }
}

/* ===================== drawing (flat, chunky, rounded) ===================== */
function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function circ(c, x, y, r, fill, stroke, lw = 3){ c.beginPath(); c.arc(x, y, r, 0, 7); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
function ell(c, x, y, rx, ry, rot, fill, stroke, lw = 3){ c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
const shadow = (c, x, y, rx, ry) => ell(c, x + 4, y + 6, rx, ry, 0, "rgba(46,42,58,.18)");
function hsh(i, k = 1){ const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); }

function drawGround(c, A, t){
  c.fillStyle = A.ground; c.fillRect(0, 0, AW, AH);
  for(let i = 0; i < 70; i++){ ell(c, hsh(i, 1) * AW, hsh(i, 2) * AH, 22 + hsh(i, 3) * 40, 12 + hsh(i, 4) * 20, 0, "rgba(255,255,255,.07)"); }
  for(let i = 0; i < 60; i++){ const x = hsh(i, 5) * AW, y = hsh(i, 6) * AH; c.fillStyle = ["#FFE066", "#FF8FAB", "#FFFFFF"][i % 3]; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); }
  for(const f of A.floors){ c.fillStyle = f[4]; rr(c, f[0], f[1], f[2], f[3], 14); c.fill(); }
  for(const w of A.water){
    const mud = w[4] === "mud"; c.fillStyle = mud ? PAL.mud : PAL.water; rr(c, w[0], w[1], w[2], w[3], 28); c.fill();
    c.strokeStyle = mud ? "#6D543B" : "#FFFFFF"; c.lineWidth = 6; c.stroke();
    c.save(); rr(c, w[0], w[1], w[2], w[3], 28); c.clip(); c.strokeStyle = mud ? PAL.mud2 : PAL.water2; c.lineWidth = 4;
    for(let k = 0; k < 9; k++){ const yy = w[1] + 20 + k * 46, ox = Math.sin(t * 1.4 + k) * 14; c.beginPath();
      for(let x = w[0] - 20; x < w[0] + w[2] + 20; x += 40) c.arc(x + ox, yy + (k % 2) * 8, 10, mud ? .2 : 3.6, mud ? 2.9 : 5.8); c.stroke(); }
    c.restore();
  }
}
function drawWalls(c, A){
  for(const w of A.walls){ c.fillStyle = PAL.wall; rr(c, w[0], w[1], w[2], w[3], 7); c.fill(); c.fillStyle = PAL.wallTop; rr(c, w[0] + 2, w[1] + 2, w[2] - 4, Math.max(4, w[3] - 9), 5); c.fill(); }
}
function drawTrees(c, A, t){
  for(const tr of A.trees){ const [x, y, r] = tr; shadow(c, x, y, r, r * .8); circ(c, x, y, r, "#4CAF50", "#2E7D32", 4); circ(c, x - r * .25, y - r * .3, r * .55, "#66BB6A");
    circ(c, x + r * .3, y + r * .2, r * .3, "#5DB561"); }
}

/* ---- fixtures ---- */
function drawFixture(c, f, F, t){
  const used = F["used_" + f.id]; const {x, y} = f;
  switch(f.kind){
    case "sign": shadow(c, x, y, 40, 10); rr(c, x - 44, y - 16, 88, 32, 8); c.fillStyle = "#8D6E63"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
      c.fillStyle = "#FFF8E1"; c.font = "bold 14px Fredoka, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(used ? "FASIRA" : "SAFARI", x, y + 1); break;
    case "shelf": rr(c, x - 34, y - 14, 68, 28, 6); c.fillStyle = "#A1887F"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
      if(!used) for(let k = 0; k < 4; k++) ell(c, x - 24 + k * 16, y, 9, 6, 0, ["#FFCA28", "#8BC34A", "#FF7043", "#4FC3F7"][k], PAL.ink, 2);
      else for(let k = 0; k < 4; k++) ell(c, x - 30 + k * 22, y + 40 + (k % 2) * 14, 9, 6, k, ["#FFCA28", "#8BC34A", "#FF7043", "#4FC3F7"][k], PAL.ink, 2); break;
    case "chair": shadow(c, x, y, 18, 10); rr(c, x - 16, y - 22, 32, 44, 6); c.fillStyle = "#FFFFFF"; c.fill(); c.strokeStyle = "#E53935"; c.lineWidth = 4; c.stroke(); break;
    case "lounger": rr(c, x - 22, y - 30, 44, 60, 10); c.fillStyle = "#FFB74D"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); break;
    case "towelrack": rr(c, x - 40, y - 6, 80, 12, 6); c.fillStyle = "#8D6E63"; c.fill(); break;
    case "gong": shadow(c, x, y, 20, 10); circ(c, x, y, 20, used ? "#FFD54F" : "#F9A825", PAL.ink, 3); circ(c, x, y, 8, "#FFE082"); break;
    case "table": shadow(c, x, y, f.r, f.r * .7); circ(c, x, y, f.r, "#FFFFFF", PAL.ink, 3); circ(c, x, y, f.r - 7, f.id === "ctable" ? "#FFCDD2" : "#FFF3E0"); break;
    case "counter": rr(c, x - 30, y - 22, 60, 44, 8); c.fillStyle = "#B0BEC5"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); break;
    case "tent": shadow(c, x, y, 42, 22); if(used){ ell(c, x, y + 10, 46, 20, 0, "#FF7043", PAL.ink, 3); }
      else { c.beginPath(); c.moveTo(x - 42, y + 30); c.lineTo(x, y - 34); c.lineTo(x + 42, y + 30); c.closePath(); c.fillStyle = "#FF7043"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
        c.beginPath(); c.moveTo(x, y - 34); c.lineTo(x, y + 30); c.strokeStyle = "#BF360C"; c.stroke(); } break;
    case "fire": circ(c, x, y, 22, "#795548", PAL.ink, 3); if(!F.fireOut){ for(let k = 0; k < 3; k++){ const s = 1 + Math.sin(t * 9 + k) * .15; ell(c, x + (k - 1) * 7, y - 6, 7 * s, 14 * s, 0, ["#FF7043", "#FFCA28", "#FF5722"][k]); } }
      else for(let k = 0; k < 3; k++) circ(c, x + (k - 1) * 8, y - 10 - ((t * 20 + k * 9) % 30), 6, "rgba(200,200,200,.6)"); break;
    case "flagpole": c.strokeStyle = "#9E9E9E"; c.lineWidth = 5; c.beginPath(); c.moveTo(x, y + 10); c.lineTo(x, y - 60); c.stroke(); circ(c, x, y - 62, 5, "#FFD54F");
      if(!F.flagged){ c.fillStyle = "#42A5F5"; c.beginPath(); c.moveTo(x, y - 58); c.lineTo(x + 30, y - 50); c.lineTo(x, y - 42); c.fill(); } break;
    case "line": c.strokeStyle = "#ECEFF1"; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 60, y); c.lineTo(x + 60, y); c.stroke(); break;
    case "board": rr(c, x - 28, y - 22, 56, 44, 6); c.fillStyle = "#6D4C41"; c.fill(); rr(c, x - 22, y - 16, 44, 30, 4); c.fillStyle = "#FFF8E1"; c.fill(); break;
    case "jeep": if(f.r) drawJeep(c, x, y, "#558B2F", 0); else { drawJeep(c, x, y, "#558B2F", 0); c.fillStyle = "#FFFFFF"; c.font = "bold 13px Fredoka, sans-serif"; c.textAlign = "center"; c.fillText("ESCAPE", x, y - 46); } break;
    case "bell": shadow(c, x, y, 26, 12); rr(c, x - 34, y + 10, 68, 12, 4); c.fillStyle = "#8D6E63"; c.fill();
      c.save(); c.translate(x, y); c.rotate(used ? Math.sin(t * 10) * .4 : 0); c.beginPath(); c.moveTo(-18, 10); c.quadraticCurveTo(-18, -24, 0, -24); c.quadraticCurveTo(18, -24, 18, 10); c.closePath();
      c.fillStyle = "#FFC107"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); c.restore(); break;
    case "mic": c.strokeStyle = PAL.ink; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y + 14); c.lineTo(x, y - 6); c.stroke(); ell(c, x, y - 12, 7, 10, 0, "#616161", PAL.ink, 2); break;
    case "desk": rr(c, x - 40, y - 24, 80, 48, 8); c.fillStyle = "#8D6E63"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); break;
  }
}
function drawJeep(c, x, y, col, rot){
  c.save(); c.translate(x, y); c.rotate(rot); shadow(c, 0, 0, 30, 46);
  for(const [dx, dy] of [[-26, -26], [26, -26], [-26, 26], [26, 26]]) { rr(c, dx - 6, dy - 11, 12, 22, 4); c.fillStyle = PAL.ink; c.fill(); }
  rr(c, -24, -40, 48, 80, 12); c.fillStyle = col; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
  rr(c, -18, -30, 36, 16, 5); c.fillStyle = "#B3E5FC"; c.fill(); rr(c, -18, 0, 36, 30, 6); c.fillStyle = "#33691E"; c.fill(); c.restore();
}

/* ---- loose objects ---- */
function drawObj(c, o, t, F){
  const {x, y} = o; if(o.gone) return;
  switch(o.kind){
    case "rack": shadow(c, x, y, 22, 12); circ(c, x, y, 22, "#B0BEC5", PAL.ink, 3); for(let k = 0; k < 4; k++){ const a = k * 1.57 + .4; rr(c, x + Math.cos(a) * 11 - 6, y + Math.sin(a) * 11 - 8, 12, 16, 2); c.fillStyle = ["#FF8A65", "#4DD0E1", "#FFF176", "#AED581"][k]; c.fill(); } break;
    case "crate": shadow(c, x, y, 22, 14); rr(c, x - 21, y - 21, 42, 42, 6); c.fillStyle = "#D7A86E"; c.fill(); c.strokeStyle = "#8D6E63"; c.lineWidth = 4; c.stroke(); c.beginPath(); c.moveTo(x - 18, y - 18); c.lineTo(x + 18, y + 18); c.stroke(); break;
    case "jar": rr(c, x - 9, y - 12, 18, 24, 6); c.fillStyle = "rgba(225,245,254,.9)"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 2; c.stroke(); circ(c, x - 2, y + 4, 4, "#FFD54F"); circ(c, x + 3, y, 4, "#FFD54F"); break;
    case "bucket": shadow(c, x, y, 13, 8); circ(c, x, y, 13, "#8D6E63", PAL.ink, 3); circ(c, x, y, 9, PAL.mud); break;
    case "whistle": circ(c, x, y, 8, "#CFD8DC", PAL.ink, 2); rr(c, x, y - 3, 12, 6, 2); c.fillStyle = "#CFD8DC"; c.fill(); break;
    case "towel": rr(c, x - 13, y - 9, 26, 18, 4); c.fillStyle = "#FFFFFF"; c.fill(); c.fillStyle = o.id === "towel2" ? "#4FC3F7" : o.id === "towel3" ? "#FFB74D" : "#F06292"; c.fillRect(x - 13, y - 3, 26, 6); break;
    case "cart": shadow(c, x, y, 26, 16); rr(c, x - 26, y - 18, 52, 36, 8); c.fillStyle = "#FFEB3B"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
      for(let k = 0; k < 4; k++){ c.save(); c.translate(x, y - 4); c.rotate(k * 1.57); c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 20, 0, 1.57); c.closePath(); c.fillStyle = k % 2 ? "#E53935" : "#FFFFFF"; c.fill(); c.restore(); } break;

    const joy = this.w.querySelector(".joy"), knob = this.w.querySelector(".knob"); let id = null, cx = 0, cy = 0;
    const set = (x, y) => { const dx = x - cx, dy = y - cy, m = Math.hypot(dx, dy), R0 = 46, k = Math.min(1, m / R0); this.joy = m > 6 ? {x: dx / m * k, y: dy / m * k} : {x: 0, y: 0}; knob.style.transform = `translate(${this.joy.x * R0}px,${this.joy.y * R0}px)`; };
    joy.addEventListener("pointerdown", e => { id = e.pointerId; joy.setPointerCapture(id); const r = joy.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; set(e.clientX, e.clientY); ac(); });
    joy.addEventListener("pointermove", e => { if(e.pointerId === id) set(e.clientX, e.clientY); });
    const end = e => { if(e.pointerId !== id) return; id = null; this.joy = {x: 0, y: 0}; knob.style.transform = ""; };
    joy.addEventListener("pointerup", end); joy.addEventListener("pointercancel", end);
    const pad = (sel, down, up) => { const b = this.w.querySelector(sel); b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("on"); ac(); down(); });
      const off = () => { b.classList.remove("on"); up && up(); }; b.addEventListener("pointerup", off); b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off); };
    pad(".grab", () => this.action("grab"));
    pad(".noise", () => this.action("noise"));
    if(this.role === "G") pad(".spec", () => { this.a.s = 1; }, () => { this.a.s = 0; });
    else pad(".spec", () => { if(this.cd <= 0 && this.stun <= 0){ this.a.c = 1; this.chargeT = CHARGE_TIME; this.cd = CHARGE_CD; } });
  }
  action(k){
    if(this.stun > 0) return;
    if(k === "noise"){ (this.role === "G" ? SFX.snort : SFX.bellow)(); }
    if(this.host) this.doAct(this.role, k);
    else { this.act++; api.update(rid(S.code) + "_p_" + this.me, {act: {n: Date.now() * 10 + (this.act % 10), k, ts: Date.now()}, area: this.ai}).catch(() => {}); }
  }
  doAct(role, k){ if(!this.world || this.paused) return; if(k === "grab") this.world.grab(role); else if(k === "noise") this.world.noise(role); }

  /* loop */
  frame(now){
    if(this.dead) return; this.raf = requestAnimationFrame(t => this.frame(t));
    const dt = Math.min(.05, (now - this.last) / 1000); this.last = now; this.t += dt;
    const partnerOn = this.partner && Date.now() - this.pRecv < 6000;
    const worldOn = this.host || Date.now() - this.wRecv < 6000;
    this.paused = !partnerOn || !worldOn;
    this.w.querySelector(".wait").textContent = this.paused ? `Waiting for ${PNAME[this.prole]}…` : "";
    this.w.querySelector(".wait").classList.toggle("on", this.paused);
    if(!this.paused) this.moveMe(dt);
    if(this.host && !this.paused){
      this.world.P.H = this.partnerPos(true);
      const fresh = this.world.tick(dt);
      for(const id of fresh) api.update(rid(S.code), {[`done/${this.ai}/${id}`]: true}).catch(() => {});
      this.events(this.world.events);
      this.wsend = (this.wsend || 0) + dt; if(this.wsend > .25){ this.wsend = 0; api.update(rid(S.code) + "_w", this.world.snap()).catch(() => {}); }
      const done = Object.assign({}, (R.done || {})[this.ai], this.world.done);
      if(this.A.pranks.every(p => done[p.id]) && !this.advancing){ this.advancing = true; this.banner(`${this.A.name} wrecked!`, this.ai < 5 ? `Next: ${AREAS[this.ai + 1].name}` : "");
        setTimeout(() => { if(!this.dead) api.update(rid(S.code), this.ai >= 5 ? {phase: "won"} : {area: this.ai + 1}).catch(() => { this.advancing = false; }); }, 4500); }
    }
    if(!this.host){ const done = (R.done || {})[this.ai] || {}; if(this.A.pranks.every(p => done[p.id]) && !this.advancing){ this.advancing = true; this.banner(`${this.A.name} wrecked!`, this.ai < 5 ? `Next: ${AREAS[this.ai + 1].name}` : ""); } }
    this.sendT += dt; if(this.sendT > .25){ this.sendT = 0; const a = this.a; api.update(rid(S.code) + "_p_" + this.me, {x: Math.round(a.x), y: Math.round(a.y), d: Math.round(a.d * 100) / 100, s: a.s, c: a.c, w: a.w, mv: a.mv, ts: Date.now(), area: this.ai}).catch(() => {}); }
    this.draw();
  }
  moveMe(dt){
    const a = this.a, A = this.A;
    this.cd -= dt; this.stun -= dt;
    let vx = 0, vy = 0;
    if(this.kb){ this.kb.t -= dt; vx = this.kb.x * 280; vy = this.kb.y * 280; if(this.kb.t <= 0) this.kb = null; }
    else if(this.chargeT > 0){ this.chargeT -= dt; vx = Math.cos(a.d) * CHARGE_SPEED; vy = Math.sin(a.d) * CHARGE_SPEED; if(this.chargeT <= 0) a.c = 0; }
    else if(this.stun <= 0){ const sp = (this.role === "G" && a.s ? STRETCH_WALK : WALK) * (this.role === "G" && a.w ? WADE : 1); vx = this.joy.x * sp; vy = this.joy.y * sp;
      if(Math.hypot(this.joy.x, this.joy.y) > .15) a.d = Math.atan2(this.joy.y, this.joy.x); }
    a.x += vx * dt; a.y += vy * dt; a.mv = Math.hypot(vx, vy) > 10 ? 1 : 0;
    collide(a, RAD[this.role], A, this.role === "G" ? this.heavyObjs() : null);
    a.w = waterAt(A, a.x, a.y) ? 1 : 0;
  }
  heavyObjs(){ if(this.host) return this.world.objs; const s = this.snapB; if(!s) return [];
    return this.A.objs.filter(o => o.heavy).map(o => { const v = s.o[o.id]; return {x: v[0], y: v[1], r: o.r, heavy: true, gone: v[3]}; }); }
  partnerPos(raw){ const p = this.partner; if(!p) return null;
    if(raw || !this.pPrev) return {x: p.x, y: p.y, d: p.d, s: p.s, c: p.c, w: p.w, mv: p.mv};
    const k = clamp((Date.now() - this.pRecv) / 200, 0, 1), q = this.pPrev; let dd = p.d - q.d; dd = Math.atan2(Math.sin(dd), Math.cos(dd));
    return {x: q.x + (p.x - q.x) * k, y: q.y + (p.y - q.y) * k, d: q.d + dd * k, s: p.s, c: p.c, w: p.w, mv: p.mv}; }
  events(list){
    for(const e of list){ if(e.i <= this.seenE) continue; this.seenE = e.i;
      const x = e.k === "bonk" ? null : e.x, y = e.y;
      if(e.k === "splash"){ this.fx.push({k: "splash", x: e.x, y: e.y, t: this.t}); SFX.splash(); }
      if(e.k === "noise"){ this.fx.push({k: "noise", x: e.x, y: e.y, who: e.who, t: this.t}); if(e.who !== this.role) (e.who === "G" ? SFX.snort : SFX.bellow)(); }
      if(e.k === "flash"){ const n = this.npcView().find(n => n.id === e.obj); if(n) this.fx.push({k: "flash", x: n.x, y: n.y, t: this.t}); }
      if(e.k === "snap"){ this.fx.push({k: "snap", x: e.x, y: e.y, t: this.t}); }
      if(e.k === "grab" && e.who === this.role) SFX.grab();
      if(e.k === "drop" && e.who === this.role) SFX.drop();
      if(e.k === "spot") SFX.spot();
      if(e.k === "prank"){ const p = this.A.pranks.find(p => p.id === e.obj); if(p){ this.toast("✓ " + p.text); SFX.done(); } }
      if(e.k === "bonk"){ const who = e.who; const bx = this.host ? e.x : e.x / 100, by = this.host ? e.y : e.y / 100;
        const tgt = who === this.role ? this.a : this.partnerPos(); if(tgt) this.fx.push({k: "bonk", x: tgt.x, y: tgt.y, t: this.t});
        if(who === this.role){ this.kb = {x: bx, y: by, t: .35}; this.stun = .9; this.a.c = 0; this.chargeT = 0; SFX.bonk(); this.toast("Caught! They took it back."); } }
    }
  }
  npcView(){
    if(this.host) return this.world.npcs;
    const B = this.snapB, Aa = this.snapA; if(!B) return this.A.npcs.map(n => Object.assign({}, n, {st: n.beh, dir: n.face ?? 1.57}));
    const k = clamp((Date.now() - this.snapT) / 200, 0, 1);
    return this.A.npcs.map(n => { const b = B.n[n.id], a = Aa?.n?.[n.id] || b; if(!b) return null; let dd = b[3] / 100 - a[3] / 100; dd = Math.atan2(Math.sin(dd), Math.cos(dd));
      return Object.assign({}, n, {x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, st: b[2], dir: a[3] / 100 + dd * k, moving: Math.hypot(b[0] - a[0], b[1] - a[1]) > 2, angry: b[4], jump: b[5]}); }).filter(Boolean);
  }
  objView(){
    if(this.host) return this.world.objs;
    const B = this.snapB, Aa = this.snapA; if(!B) return this.A.objs.map(o => Object.assign({}, o, {holder: ""}));
    const k = clamp((Date.now() - this.snapT) / 200, 0, 1);
    return this.A.objs.map(o => { const b = B.o[o.id], a = Aa?.o?.[o.id] || b; if(!b) return null; return Object.assign({}, o, {x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, holder: b[2], gone: !!b[3]}); }).filter(Boolean);
  }
  flags(){ return this.host ? this.world.flag : (this.snapB?.f || {}); }

  /* drawing */
  draw(){
    const c = this.c, W = this.cv.width, H = this.cv.height, dpr = devicePixelRatio || 1, view = 430, sc = W / (view * dpr) * dpr;
    const vw = W / sc, vh = H / sc, cx = clamp(this.a.x - vw / 2, 0, Math.max(0, AW - vw)), cy = clamp(this.a.y - vh / 2, 0, Math.max(0, AH - vh));
    c.setTransform(sc, 0, 0, sc, -cx * sc, -cy * sc);
    const F = this.flags(), A = this.A;
    drawGround(c, A, this.t); drawWalls(c, A);
    for(const f of A.fixtures) drawFixture(c, f, F, this.t);
    const objs = this.objView(), loose = objs.filter(o => !o.holder || (o.attach && !o.holder)), held = objs.filter(o => o.holder);
    for(const o of loose) if(!o.attach) drawObj(c, o, this.t, F);
    const npcs = this.npcView(); const pa = this.partnerPos();
    const actors = [...npcs.map(n => ({y: n.y, f: () => drawNPC(c, n, n.look, this.t)})),
      {y: this.a.y, f: () => (this.role === "G" ? drawGinger : drawHarriet)(c, this.a, this.t, true)}];
    if(pa) actors.push({y: pa.y, f: () => (this.prole === "G" ? drawGinger : drawHarriet)(c, pa, this.t, false)});
    actors.sort((p, q) => p.y - q.y).forEach(x => x.f());
    for(const o of objs) if(o.attach && !o.holder) drawObj(c, o, this.t, F);
    for(const o of held) drawObj(c, o, this.t, F);
    drawTrees(c, A, this.t);
    drawFx(c, this.fx, this.t); this.fx = this.fx.filter(f => this.t - f.t < 1.5);
    drawName(c, this.a.x, this.a.y - 40, "You", "#FFE082");
    if(pa) drawName(c, pa.x, pa.y - 42, R.players?.[this.pp]?.name || PNAME[this.prole], "#FFFFFF");
  }

  /* overlays */
  toast(s){ const t = this.w.querySelector(".toast"); t.textContent = s; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); }
  banner(a, b){ const t = this.w.querySelector(".toast"); t.innerHTML = `<b>${esc(a)}</b>${b ? `<br>${esc(b)}` : ""}`; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show", "big"); }
  sheet(refresh){
    const sh = this.w.querySelector(".sheet"); this.sheetMode = "list"; const done = Object.assign({}, (R.done || {})[this.ai], this.host ? this.world.done : {});
    sh.innerHTML = `<div class="sheet-in"><h2>${esc(this.A.name)}</h2><p class="muted">🦒 Ginger · 🦛 Harriet · 🦒🦛 both · ✋ either</p><ul>${this.A.pranks.map(p => `<li class="${done[p.id] ? "done" : ""}"><span class="who">${ICON[p.who]}</span><span>${esc(p.text)}</span></li>`).join("")}</ul><button class="btn" data-x>Back to mischief</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden");
  }
  menu(){
    const sh = this.w.querySelector(".sheet"); this.sheetMode = "menu";
    sh.innerHTML = `<div class="sheet-in"><h2>Paused?</h2><p class="muted">Game code <b>${S.code}</b>. Progress saves automatically. Rejoin anytime with this code and your name.</p><button class="btn" data-x>Keep playing</button><button class="btn ghost" data-l>Leave game</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden"); sh.querySelector("[data-l]").onclick = leave;
  }
}

/* iPhone: no long-press selection or menus during play */
document.addEventListener("contextmenu", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });

if(S) connect(); else homeScreen();

window.addEventListener("unhandledrejection", e => { const el = document.querySelector(".err"); if(el && el.isConnected) el.textContent = "Couldn't connect: " + (e.reason && (e.reason.code || e.reason.message) || e.reason); });
