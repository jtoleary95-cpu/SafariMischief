const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function inst(name, f, t, d){
  if(name === "marimba"){ osc("music", f, d * .9, "sine", .16, {at: t}); osc("music", f * 4, .06, "sine", .05, {at: t}); }
  else if(name === "steel"){ osc("music", f, d, "sine", .14, {at: t}); osc("music", f * 2.76, d * .5, "sine", .05, {at: t}); osc("music", f * 5.4, d * .25, "sine", .02, {at: t}); }
  else if(name === "pizz"){ osc("music", f, .14, "triangle", .14, {at: t}); }
  else if(name === "banjo"){ osc("music", f, .18, "square", .05, {at: t, bp: f * 3, q: 2}); osc("music", f * 2, .1, "sawtooth", .02, {at: t}); }
  else if(name === "whistle"){ osc("music", f, d * .8, "sine", .1, {at: t, vib: 6, vibd: f * .02, atk: .03}); }
  else if(name === "spy"){ osc("music", f, d * .9, "sawtooth", .045, {at: t, bp: f * 2, q: 3}); }
}
const MUSIC = {
  tune: -1, iv: 0, step: 0, next: 0, speed: 1,
  play(i){ if(this.tune === i && this.iv) return; this.stop(); this.tune = i; if(!sndOn("music")) return; const a = ac(); if(!a) return; this.step = 0; this.next = a.currentTime + .1; this.iv = setInterval(() => this.sched(), 60); },
  resume(){ if(this.tune >= 0){ const i = this.tune; this.tune = -1; this.play(i); } },
  stop(){ clearInterval(this.iv); this.iv = 0; },
  sched(){ const a = ac(), T = TUNES[this.tune]; if(!a || !T) return; const sd = 60 / (T.bpm * this.speed) / 2;
    while(this.next < a.currentTime + .25){ const s = this.step, t = this.next, m = T.mel[s % T.mel.length];
      if(m >= 0) inst(T.lead, midi(T.key + m), t, sd * 1.6);
      if(s % 2 === 0){ const b = T.bass[(s / 2) % T.bass.length]; if(T.tuba) osc("music", midi(T.key - 24 + b), sd * 1.5, "sawtooth", .06, {at: t, bp: 300, q: 2}); else osc("music", midi(T.key - 12 + b), sd * 1.6, "triangle", .1, {at: t}); }
      if(T.drum === "bongo"){ if(s % 4 === 0) osc("music", 180, .1, "sine", .14, {at: t, to: 120}); if(s % 4 === 3) osc("music", 260, .07, "sine", .1, {at: t, to: 200}); }
      if(T.drum === "shaker" && s % 2 === 1) noise("music", .06, .05, {f: 6000, q: 1, at: t});
      if(T.drum === "tick" && s % 2 === 0) noise("music", .03, .05, {f: 3000, q: 4, at: t});
      if(T.drum === "cricket" && s % 8 === 5){ for(let k = 0; k < 3; k++) osc("music", 4200, .03, "sine", .015, {at: t + k * .05}); }
      this.step++; this.next += sd; } }
};

/* ===================== drawing (flat, chunky, rounded) ===================== */
function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function circ(c, x, y, r, fill, stroke, lw = 3){ c.beginPath(); c.arc(x, y, r, 0, 7); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
function ell(c, x, y, rx, ry, rot, fill, stroke, lw = 3){ c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
const shadow = (c, x, y, rx, ry) => ell(c, x + 4, y + 6, rx, ry, 0, "rgba(46,42,58,.18)");
function hsh(i, k = 1){ const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); }

function drawGround(c, A, t){
  c.fillStyle = A.ground; c.fillRect(0, 0, AW, AH);
  for(let i = 0; i < 70; i++){ ell(c, hsh(i, 1) * AW, hsh(i, 2) * AH, 22 + hsh(i, 3) * 40, 12 + hsh(i, 4) * 20, 0, "rgba(255,255,255,.07)"); }
  for(let i = 0; i < 60; i++){ const x = hsh(i, 5) * AW, y = hsh(i, 6) * AH; c.fillStyle = ["#FFE066", "#FF8FAB", "#FFFFFF"][i % 3]; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); }
  for(const f of A.floors){ c.fillStyle = f[4]; rr(c, f[0], f[1], f[2], f[3], 14); c.fill(); }
  for(const w of A.water){
    const mud = w[4] === "mud"; c.fillStyle = mud ? PAL.mud : PAL.water; rr(c, w[0], w[1], w[2], w[3], 28); c.fill();
    c.strokeStyle = mud ? "#6D543B" : "#FFFFFF"; c.lineWidth = 6; c.stroke();
    c.save(); rr(c, w[0], w[1], w[2], w[3], 28); c.clip(); c.strokeStyle = mud ? PAL.mud2 : PAL.water2; c.lineWidth = 4;
    for(let k = 0; k < 9; k++){ const yy = w[1] + 20 + k * 46, ox = Math.sin(t * 1.4 + k) * 14; c.beginPath();
      for(let x = w[0] - 20; x < w[0] + w[2] + 20; x += 40) c.arc(x + ox, yy + (k % 2) * 8, 10, mud ? .2 : 3.6, mud ? 2.9 : 5.8); c.stroke(); }
    c.restore();
  }
}
function drawWalls(c, A){
  for(const w of A.walls){ c.fillStyle = PAL.wall; rr(c, w[0], w[1], w[2], w[3], 7); c.fill(); c.fillStyle = PAL.wallTop; rr(c, w[0] + 2, w[1] + 2, w[2] - 4, Math.max(4, w[3] - 9), 5); c.fill(); }
}
function drawTrees(c, A, t){
  for(const tr of A.trees){ const [x, y, r] = tr; shadow(c, x, y, r, r * .8); circ(c, x, y, r, "#4CAF50", "#2E7D32", 4); circ(c, x - r * .25, y - r * .3, r * .55, "#66BB6A");
    circ(c, x + r * .3, y + r * .2, r * .3, "#5DB561"); }
}

/* ---- fixtures ---- */
function drawFixture(c, f, F, t){
  const used = F["used_" + f.id]; const {x, y} = f;
  switch(f.kind){
    case "sign": shadow(c, x, y, 40, 10); rr(c, x - 44, y - 16, 88, 32, 8); c.fillStyle = "#8D6E63"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();

    for(const r of ["G", "H"]){ const a = this.P[r]; if(!a) continue; const dx = a.x - n.x, dy = a.y - n.y, d = Math.hypot(dx, dy); let da = Math.atan2(dy, dx) - n.dir; da = Math.atan2(Math.sin(da), Math.cos(da));
      if(d < 190 && Math.abs(da) < .7) hits.push(r); }
    if(hits.length === 2) this.cnt["photo2_" + (tag || n.id)] = (this.cnt["photo2_" + (tag || n.id)] || 0) + 1;
    if(hits.length){ this.cnt["photo_" + (tag || n.id)] = (this.cnt["photo_" + (tag || n.id)] || 0) + 1; this.cnt.photos = (this.cnt.photos || 0) + 1; this.emit("snap", {obj: n.id, who: hits.join(""), x: n.x, y: n.y}); }
    return hits;
  }

  /* ---- people ---- */
  goTo(n, tgt, speed, dt, swim){
    if(!tgt) return true; const d0 = Math.hypot(tgt.x - n.x, tgt.y - n.y); if(d0 < 8) return true;
    if(swim){ this.step(n, tgt, speed, dt, true); return false; }
    if(!n.path || n.repath <= this.t || n.ptgt !== tgt){ n.path = findPath(this.G, n.x, n.y, tgt.x, tgt.y); n.ptgt = tgt; n.repath = this.t + (n.st === "chase" ? .45 : 3); }
    while(n.path.length && Math.hypot(n.path[0].x - n.x, n.path[0].y - n.y) < 10) n.path.shift();
    this.step(n, n.path[0] || tgt, speed, dt, false); return false;
  }
  step(n, w, speed, dt, swim){ const dx = w.x - n.x, dy = w.y - n.y, d = Math.hypot(dx, dy) || 1, s = Math.min(d, speed * dt); n.x += dx / d * s; n.y += dy / d * s; n.dir = Math.atan2(dy, dx); if(!swim) collide(n, 14, this.A, this.objs); n.moving = this.t; }
  sees(n, a){ if(!a) return false; const dx = a.x - n.x, dy = a.y - n.y, d = Math.hypot(dx, dy), g = Math.max(n.grudge?.G || 0, n.grudge?.H || 0); if(d > SIGHT * (1 + .2 * g)) return false; if(d < 80) return true;
    let da = Math.atan2(dy, dx) - n.dir; da = Math.atan2(Math.sin(da), Math.cos(da)); return Math.abs(da) < 1.2; }
  chase(n, role, why){ if(this.flag["pen_" + role] || this.immune[role] > this.t) return; if(n.st !== "chase") { this.emit("spot", {obj: n.id, who: role}); this.say(n.id, why === "staff" ? "Staff only!" : why === "item" ? "Hey! That's mine!" : "HEY!", 1.6, "hey"); }
    n.st = "chase"; n.who = role; n.why = why; n.until = this.t + 7; n.path = null; this.emote(n.id, "❗", 1.5); }
  disguised(r){ return this.objs.some(o => o.worn === r && o.disguise); }
  npcTick(n, dt){
    if(n.startle && this.t < n.startle){ n.dir += dt * 4; return; }
    if(n.bub && this.t > n.bub.until) n.bub = null; if(n.emo && this.t > n.emo.until) n.emo = null;
    if(["busy", "photo"].includes(n.st)){ if(n.st === "photo"){ n.timer -= dt; if(n.timer <= 0){ n.timer = n.every || 4; this.photo(n); } } return; }
    if(["post", "wander", "route", "investigate", "sit"].includes(n.st)){
      n.vt -= dt; if(n.vt <= 0){ n.vt = .25;
        for(const r of ["G", "H"]){ const a = this.P[r]; if(!a || this.flag["pen_" + r] || this.immune[r] > this.t || !this.sees(n, a)) continue;
          const o = this.held(r);
          if(o && (o.own === n.id || (o.own === "*" && n.staff))){ this.chase(n, r, "item"); break; }
          if(n.staff && (this.A.staffZ || []).some(z => this.inZ(r, z)) && !this.disguised(r)){ this.chase(n, r, "staff"); break; }
          if(n.grudge[r] > 0 && !n.emo && Math.random() < .3) this.emote(n.id, "🤨", 1.5); }
        n.rt -= .25;
        if(n.rt <= 0 && n.st !== "sit"){ n.rt = 1.5;
          const o = this.objs.find(o => o.own === n.id && !o.holder && !o.worn && !o.gone && !o.stay && !o.fixed && Math.hypot(o.x - o.home[0], o.y - o.home[1]) > 70 && Math.hypot(o.x - n.x, o.y - n.y) < 320);
          if(o){ this.emote(n.id, "😤", 1.5); this.emit("say", {obj: n.id, s: "grumble"}); this.script(n.id, [{go: o.id}, {take: o.id}, {go: o.home}, {home: o.id}]); return; } } }
    }
    const home = {x: n.home[0], y: n.home[1]}, sp = NPC_WALK * (n.spd || 1);
    switch(n.st){
      case "post": if(this.goTo(n, home, sp, dt)){ n.dir = n.face ?? n.dir; n.path = null; if(n.beh === "sit") n.st = "sit"; } break;
      case "sit": break;
      case "wander": n.timer -= dt; if(!n.tgt || n.timer <= 0){ n.timer = 3 + Math.random() * 3; const ang = Math.random() * 6.28, r = Math.random() * (n.rad || 120); n.tgt = {x: clamp(home.x + Math.cos(ang) * r, 30, AW - 30), y: clamp(home.y + Math.sin(ang) * r, 30, AH - 30)}; }
        this.goTo(n, n.tgt, sp * .7, dt); break;
      case "route": { const w = n.route[n.wp % n.route.length], t = {x: w[0], y: w[1]}; if(n.rtw !== n.wp){ n.rtw = n.wp; n.rtg = t; n.path = null; } if(this.goTo(n, n.rtg, sp, dt)){ n.pause = (n.pause || 0) + dt; if(n.pause > (w[2] || 0)){ n.pause = 0; n.wp++; } } break; }
      case "investigate": if(this.goTo(n, n.tgt, sp * 1.15, dt)){ n.timer += dt; n.dir += dt * 2.5; if(n.timer > 2.2){ n.st = n.beh === "sit" ? "post" : n.beh; n.tgt = null; n.path = null; } } break;
      case "chase": { const a = this.P[n.who]; const keep = n.why === "item" ? !!this.held(n.who) : true;
        if(!a || this.t > n.until || !keep || this.flag["pen_" + n.who] || Math.hypot(a.x - n.x, a.y - n.y) > 450){ n.st = n.beh === "sit" ? "post" : n.beh; n.path = null; this.emit("say", {obj: n.id, s: "grumble"}); break; }
        this.goTo(n, {x: a.x, y: a.y}, NPC_CHASE * (n.spd || 1), dt, false);
        if(Math.hypot(a.x - n.x, a.y - n.y) < RAD[n.who] + 16 && this.immune[n.who] <= this.t) this.caught(n, n.who); break; }
      case "script": this.runScript(n, dt); break;
    }
  }
  runScript(n, dt){
    const s = n.script?.[n.sk]; if(!s){ n.script = null; n.st = n.beh === "sit" ? "post" : n.beh; n.path = null; return; }
    const next = () => { n.sk++; n.sw = 0; n.path = null; };
    if(s.go !== undefined){ const p = typeof s.go === "string" ? this.pos(s.go) : {x: s.go[0], y: s.go[1]}; if(!p){ next(); return; } const tgt = n.sgo === n.sk + ":" + s.go ? n.sgt : (n.sgo = n.sk + ":" + s.go, n.sgt = {x: p.x, y: p.y});
      if(typeof s.go === "string" && (s.go === "G" || s.go === "H")){ n.sgt.x = p.x; n.sgt.y = p.y; }
      if(this.goTo(n, tgt, NPC_WALK * (s.run ? 1.6 : 1) * (n.spd || 1), dt, s.swim) || Math.hypot(tgt.x - n.x, tgt.y - n.y) < (s.d || 12)) next(); return; }
    if(s.say){ this.say(n.id, s.say, s.t || 1.8, s.s); next(); return; }
    if(s.emote){ this.emote(n.id, s.emote, s.t || 1.8); next(); return; }
    if(s.wait){ n.sw += dt; if(s.spin) n.dir += dt * 3; if(n.sw >= s.wait) next(); return; }
    if(s.face !== undefined){ n.dir = s.face; next(); return; }
    if(s.take){ const o = this.o(s.take); if(o && !o.gone){ if(o.holder === "G" || o.holder === "H") this.emit("taken", {who: o.holder, obj: o.id}); o.holder = n.id; o.worn = ""; } next(); return; }
    if(s.put){ const o = this.objs.find(o => o.holder === n.id); if(o){ o.holder = ""; o.x = s.put[0]; o.y = s.put[1]; } next(); return; }
    if(s.home){ const o = this.o(s.home); if(o){ o.holder = ""; o.worn = ""; o.x = o.home[0]; o.y = o.home[1]; o.high = (this.A.objs.find(q => q.id === o.id) || {}).high; } next(); return; }
    if(s.photo){ this.photo(n, s.photo); next(); return; }
    if(s.set){ this.flag[s.set] = s.v ?? 1; next(); return; }
    if(s.do){ try{ s.do(this.W, n); }catch(e){ console.warn(e); } next(); return; }
    if(s.st){ n.st = s.st; n.script = null; return; }
    next();
  }
  caught(n, role){
    const a = this.P[role]; const dx = a.x - n.x, dy = a.y - n.y, d = Math.hypot(dx, dy) || 1;
    this.immune[role] = this.t + 2.5; n.grudge[role]++;
    this.catches[role] = this.catches[role].filter(t => this.t - t < 60); this.catches[role].push(this.t);
    const o = this.held(role), pen = this.A.pen && (this.catches[role].length >= 2 || n.why === "staff");
    this.emit("bonk", {who: role, x: dx / d, y: dy / d, obj: n.id});
    if(o){ o.holder = n.id; this.script(n.id, [{say: "I'll take that!", t: 1.5, s: "grumble"}, {go: o.home}, {home: o.id}]); this.emit("taken", {who: role, obj: o.id}); }
    for(const w of this.objs) if(w.worn === role && w.own){ w.worn = ""; w.x = w.home[0]; w.y = w.home[1]; }
    if(pen){ this.flag["pen_" + role] = 1; this.emit("pen", {who: role}); if(!o){ n.st = n.beh === "sit" ? "post" : n.beh; n.path = null; } this.say(n.id, "Into the pen with you!", 2, "hey"); }
    else if(!o){ this.emit("shoo", {who: role}); this.say(n.id, "Shoo! Out!", 1.6, "hey"); n.st = n.beh === "sit" ? "post" : n.beh; n.path = null; }
  }

  /* ---- what the partner's phone needs to draw ---- */
  snap(){
    const r1 = v => Math.round(v);
    const o = {}; for(const x of this.objs) o[x.id] = [r1(x.x), r1(x.y), x.holder || "", x.gone ? 1 : 0, x.worn || "", x.high ? 1 : 0];
    const n = {}; for(const x of this.npcs) n[x.id] = [r1(x.x), r1(x.y), x.st, Math.round(x.dir * 100), x.emo ? x.emo.e : "", x.bub ? x.bub.txt : ""];
    const fx = {}; for(const f of this.fix) if(f.n) fx[f.id] = f.n;
    return {a: this.ai, o, n, fx, f: Object.assign({}, this.flag), c: Object.assign({}, this.cnt),
      e: this.events.slice(-16).map(e => ({i: e.i, k: e.k, who: e.who || "", obj: e.obj || "", s: e.s || "", big: e.big || 0, x: e.x != null ? r1(e.x * (e.k === "bonk" ? 100 : 1)) : 0, y: e.y != null ? r1(e.y * (e.k === "bonk" ? 100 : 1)) : 0}))};
  }
}

/* ===================== Safari Mischief: game ===================== */

const ICON = {G: "🦒", H: "🦛", B: "🦒🦛", "": "✋"};
const PNAME = {G: "Ginger", H: "Harriet"};

/* ---------- screens ---------- */
function homeScreen(){
  mountedKey = "home"; stopPlay(); app.innerHTML = "";

  w.querySelector("[data-a=make]").onclick = async () => { const n = name(); if(!n) return; ac(); err.textContent = "Creating…";
    try{ const L = "ABCDEFGHJKMNPQRSTUVWXYZ"; let code;
      for(let i = 0; i < 12; i++){ code = [...Array(4)].map(() => L[rnd(L.length)]).join(""); if(!isClean(code)) continue; if(!(await api.get(rid(code)))) break; }
      await api.update(rid(code), {created: Date.now(), phase: "lobby", "players/p1": {name: n}, area: 0});
      S = {code, pid: "p1", name: n}; saveS(); connect();

function connect(){

}

}

  if(!g.length) return ""; return `<div class="gal"><b>📸 Photobombs</b><div>${g.slice(-12).map(x => `<img src="${x.img}" alt="photobomb">`).join("")}</div></div>`; }
/* ---------- play ---------- */

class Play {
  constructor(w, role){

    const st = this.A.start[role]; this.a = {x: st[0], y: st[1], d: -Math.PI / 2, s: 0, c: 0, w: 0, mv: 0, sit: 0}; this.stepT = 0; MUSIC.play(this.ai % TUNES.length); AMB.play(this.A.amb);

      if(this.host && v.act){ if(this.lastPA == null) this.lastPA = Math.abs(Date.now() - v.act.ts) > 10000 ? v.act.n : 0; if(v.act.n > this.lastPA){ this.lastPA = v.act.n; this.doAct(this.prole, v.act.k); } } });
    if(!this.host) this.offW = api.listen(rid(S.code) + "_w", v => { if(!v || v.a !== this.ai) return; this.snapA = this.snapB; this.snapB = v; this.snapT = Date.now(); this.wRecv = Date.now(); this.events(v.e || []); });
    this.bindControls(); this.fit = () => { const r = this.cv.parentElement.getBoundingClientRect(), d = devicePixelRatio || 1; this.cv.width = r.width * d; this.cv.height = r.height * d; this.cv.style.width = r.width + "px"; this.cv.style.height = r.height + "px"; };
    this.fit(); addEventListener("resize", this.fit);

  onState(){ const done = (R.done || {})[this.ai] || {}, n = this.A.pranks.filter(p => done[p.id]).length; this.w.querySelector("[data-cnt]").textContent = `${n} of ${this.A.pranks.length} pranks`;

  /* controls */
  bindControls(){

    const set = (x, y) => { const dx = x - cx, dy = y - cy, m = Math.hypot(dx, dy), R0 = 46, k = Math.min(1, m / R0); this.joy = m > 6 ? {x: dx / m * k, y: dy / m * k} : {x: 0, y: 0}; knob.style.transform = `translate(${this.joy.x * R0}px,${this.joy.y * R0}px)`; };
    joy.addEventListener("pointerdown", e => { id = e.pointerId; joy.setPointerCapture(id); const r = joy.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; set(e.clientX, e.clientY); ac(); });

    pad(".grab", () => this.action("grab"));
    pad(".noise", () => this.action("noise"));
    if(this.role === "G") pad(".spec", () => { this.a.s = 1; }, () => { this.a.s = 0; });
    else pad(".spec", () => { if(this.cd <= 0 && this.stun <= 0 && !this.a.sit){ this.a.c = 1; this.chargeT = CHARGE_TIME; this.cd = CHARGE_CD; } });
    pad(".sit", () => { if(this.stun > 0) return; this.a.sit = this.a.sit ? 0 : 1; if(this.a.sit){ this.a.s = 0; this.a.c = 0; this.chargeT = 0; SFX.plop(); } this.action(this.a.sit ? "sit" : "stand"); });
  }
  action(k){
    if(this.stun > 0) return;
    if(k === "noise"){ if(this.a.sit) return; (this.role === "G" ? SFX.snort : SFX.bellow)(); }
    if(this.host) this.doAct(this.role, k);
    else { this.act++; api.update(rid(S.code) + "_p_" + this.me, {act: {n: Date.now() * 10 + (this.act % 10), k, ts: Date.now()}, area: this.ai}).catch(() => {}); }
  }
  doAct(role, k){ if(!this.world || this.paused) return; if(k === "grab") this.world.grab(role); else if(k === "noise") this.world.noise(role); else if(k === "sit") this.world.sit(role, true); else if(k === "stand") this.world.sit(role, false); }

  /* loop */
  frame(now){
    if(this.dead) return; this.raf = requestAnimationFrame(t => this.frame(t));
    const dt = Math.min(.05, (now - this.last) / 1000); this.last = now; this.t += dt;
    const partnerOn = this.partner && Date.now() - this.pRecv < 6000;
    const worldOn = this.host || Date.now() - this.wRecv < 6000;
    this.paused = !partnerOn || !worldOn;
    this.w.querySelector(".wait").textContent = this.paused ? `Waiting for ${PNAME[this.prole]}…` : "";
    this.w.querySelector(".wait").classList.toggle("on", this.paused);
    if(!this.paused) this.moveMe(dt);
    if(this.host && !this.paused){
      this.world.P.H = this.partnerPos(true);
      const fresh = this.world.tick(dt);
      for(const id of fresh) api.update(rid(S.code), {[`done/${this.ai}/${id}`]: true}).catch(() => {});
      this.events(this.world.events);
      this.wsend = (this.wsend || 0) + dt; if(this.wsend > .25){ this.wsend = 0; api.update(rid(S.code) + "_w", this.world.snap()).catch(() => {}); }
      const done = Object.assign({}, (R.done || {})[this.ai], this.world.done);
      if(this.A.pranks.every(p => done[p.id]) && !this.advancing){ this.advancing = true; this.banner(`${this.A.name} wrecked!`, this.ai < AREAS.length - 1 ? `Next: ${AREAS[this.ai + 1].name}` : "");
        setTimeout(() => { if(!this.dead) api.update(rid(S.code), this.ai >= AREAS.length - 1 ? {phase: "won"} : {area: this.ai + 1}).catch(() => { this.advancing = false; }); }, 4500); }
    }
    if(!this.host){ const done = (R.done || {})[this.ai] || {}; if(this.A.pranks.every(p => done[p.id]) && !this.advancing){ this.advancing = true; this.banner(`${this.A.name} wrecked!`, this.ai < AREAS.length - 1 ? `Next: ${AREAS[this.ai + 1].name}` : ""); } }
    this.sendT += dt; if(this.sendT > .25){ this.sendT = 0; const a = this.a; api.update(rid(S.code) + "_p_" + this.me, {x: Math.round(a.x), y: Math.round(a.y), d: Math.round(a.d * 100) / 100, s: a.s, c: a.c, w: a.w, mv: a.mv, sit: a.sit || 0, ts: Date.now(), area: this.ai}).catch(() => {}); }
    this.draw();
  }
  moveMe(dt){
    const a = this.a, A = this.A;
    this.cd -= dt; this.stun -= dt;
    let vx = 0, vy = 0;
    if(this.kb){ this.kb.t -= dt; vx = this.kb.x * 280; vy = this.kb.y * 280; if(this.kb.t <= 0) this.kb = null; }
    else if(this.chargeT > 0){ this.chargeT -= dt; vx = Math.cos(a.d) * CHARGE_SPEED; vy = Math.sin(a.d) * CHARGE_SPEED; if(this.chargeT <= 0) a.c = 0; }
    else if(this.stun <= 0){ const sp = (this.role === "G" && a.s ? STRETCH_WALK : WALK) * (this.role === "G" && a.w ? WADE : 1); vx = this.joy.x * sp; vy = this.joy.y * sp;
      if(Math.hypot(this.joy.x, this.joy.y) > .15) a.d = Math.atan2(this.joy.y, this.joy.x); }
    if(a.sit && !this.kb){ vx = 0; vy = 0; }
    a.x += vx * dt; a.y += vy * dt; a.mv = Math.hypot(vx, vy) > 10 ? 1 : 0;
    const pen = A.pen; if(pen && this.flags()["pen_" + this.role]){ const r = pen.r; a.x = clamp(a.x, r[0] + 20, r[0] + r[2] - 20); a.y = clamp(a.y, r[1] + 20, r[1] + r[3] - 20); }
    if(a.mv){ this.stepT -= dt; if(this.stepT <= 0){ this.stepT = this.role === "H" ? .38 : .3; SFX.step(this.role); } }
    collide(a, RAD[this.role], A, this.role === "G" ? this.heavyObjs() : null);
    a.w = waterAt(A, a.x, a.y) ? 1 : 0;
  }
  heavyObjs(){ if(this.host) return this.world.objs; const s = this.snapB; if(!s) return [];
    return this.A.objs.filter(o => o.heavy).map(o => { const v = s.o[o.id]; return {x: v[0], y: v[1], r: o.r, heavy: true, gone: v[3]}; }); }
  partnerPos(raw){ const p = this.partner; if(!p) return null;
    if(raw || !this.pPrev) return {x: p.x, y: p.y, d: p.d, s: p.s, c: p.c, w: p.w, mv: p.mv, sit: p.sit};
    const k = clamp((Date.now() - this.pRecv) / 200, 0, 1), q = this.pPrev; let dd = p.d - q.d; dd = Math.atan2(Math.sin(dd), Math.cos(dd));
    return {x: q.x + (p.x - q.x) * k, y: q.y + (p.y - q.y) * k, d: q.d + dd * k, s: p.s, c: p.c, w: p.w, mv: p.mv, sit: p.sit}; }
  events(list){
    for(const e of list){ if(e.i <= this.seenE) continue; this.seenE = e.i;
      const mine = e.who === this.role, pp = this.partnerPos();
      if(e.k === "splash"){ this.fx.push({k: "splash", x: e.x, y: e.y, t: this.t}); SFX.splash(); }
      if(e.k === "noise"){ this.fx.push({k: "noise", x: e.x, y: e.y, who: e.who, t: this.t}); if(!mine) (e.who === "G" ? SFX.snort : SFX.bellow)(); }
      if(e.k === "flash"){ const n = this.npcView().find(n => n.id === e.obj); if(n) this.fx.push({k: "flash", x: n.x, y: n.y, t: this.t}); SFX.camera(); }
      if(e.k === "snap"){ this.fx.push({k: "snap", x: e.x, y: e.y, t: this.t}); setTimeout(() => this.capture(), 60); }
      if(e.k === "fx"){ this.fx.push({k: "snap", x: e.x, y: e.y, t: this.t}); SFX.boing(); }
      if(e.k === "say"){ const n = this.A.npcs.findIndex(n => n.id === e.obj); if(SFX[e.s]) SFX[e.s](.85 + (n % 4) * .12); }
      if(e.k === "grab" && mine) SFX.grab();
      if(e.k === "drop" && mine) SFX.drop();
      if(e.k === "wear" && mine){ SFX.boing(); this.toast("Looking good."); }
      if(e.k === "sit" && !mine) SFX.plop();
      if(e.k === "spot") SFX.spot();
      if(e.k === "prank"){ const p = this.A.pranks.find(p => p.id === e.obj); if(p){ this.toast("✓ " + p.text); e.big ? SFX.big() : SFX.done(); } }
      if(e.k === "bonk"){ const bx = this.host ? e.x : e.x / 100, by = this.host ? e.y : e.y / 100, tgt = mine ? this.a : pp; if(tgt) this.fx.push({k: "bonk", x: tgt.x, y: tgt.y, t: this.t});
        if(mine){ this.kb = {x: bx, y: by, t: .35}; this.stun = .9; this.a.c = 0; this.chargeT = 0; this.a.sit = 0; SFX.bonk(); } }
      if(e.k === "taken" && mine) this.toast("Caught! They took it back.");
      if(e.k === "shoo" && mine){ const p = this.A.entrance || this.A.start[this.role]; setTimeout(() => { this.a.x = p[0]; this.a.y = p[1]; this.kb = null; }, 400); SFX.shoo(); this.toast("Shooed back to the entrance!"); }
      if(e.k === "pen" && mine){ const r = this.A.pen.r; setTimeout(() => { this.a.x = r[0] + r[2] / 2; this.a.y = r[1] + r[3] / 2; this.kb = null; }, 400); SFX.pen(); this.toast(`Locked in the pen! ${PNAME[this.prole]} has to open the gate.`); }
      if(e.k === "pen" && !mine){ SFX.pen(); this.toast(`${PNAME[e.who]} got locked in the pen! Sneak to the gate and Grab it.`); }
      if(e.k === "free"){ SFX.done(); this.toast(mine ? "You're free!" : `You freed ${PNAME[e.who]}!`); }
    }
  }
  capture(){ try{ const W0 = 240, k = W0 / this.cv.width, o = document.createElement("canvas"); o.width = W0; o.height = Math.round(this.cv.height * k);
      o.getContext("2d").drawImage(this.cv, 0, 0, o.width, o.height); const img = o.toDataURL("image/jpeg", .6);
      const key = "safari_gallery_" + S.code, g = JSON.parse(localStorage.getItem(key) || "[]"); g.push({a: this.ai, img}); while(g.length > 40) g.shift(); localStorage.setItem(key, JSON.stringify(g)); }catch{} }
  npcView(){
    if(this.host) return this.world.npcs;
    const B = this.snapB, Aa = this.snapA; if(!B) return this.A.npcs.map(n => Object.assign({}, n, {st: n.beh, dir: n.face ?? 1.57}));
    const k = clamp((Date.now() - this.snapT) / 200, 0, 1);
    return this.A.npcs.map(n => { const b = B.n[n.id], a = Aa?.n?.[n.id] || b; if(!b) return null; let dd = b[3] / 100 - a[3] / 100; dd = Math.atan2(Math.sin(dd), Math.cos(dd));
      return Object.assign({}, n, {x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, st: b[2], dir: a[3] / 100 + dd * k, moving: Math.hypot(b[0] - a[0], b[1] - a[1]) > 2, emo: b[4] ? {e: b[4]} : null, bub: b[5] ? {txt: b[5]} : null}); }).filter(Boolean);
  }
  objView(){
    if(this.host) return this.world.objs;
    const B = this.snapB, Aa = this.snapA; if(!B) return this.A.objs.map(o => Object.assign({}, o, {holder: o.on || "", gone: !!o.hidden}));
    const k = clamp((Date.now() - this.snapT) / 200, 0, 1);
    return this.A.objs.map(o => { const b = B.o[o.id], a = Aa?.o?.[o.id] || b; if(!b) return null; return Object.assign({}, o, {x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, holder: b[2], gone: !!b[3], worn: b[4], high: !!b[5]}); }).filter(Boolean);
  }
  flags(){ return this.host ? this.world.flag : (this.snapB?.f || {}); }
  fixN(id){ if(this.host){ const f = this.world.fixt(id); return f ? f.n : 0; } return this.snapB?.fx?.[id] || 0; }

  /* drawing */
  draw(){
    const c = this.c, W = this.cv.width, H = this.cv.height, dpr = devicePixelRatio || 1, view = 430, sc = W / (view * dpr) * dpr;
    const vw = W / sc, vh = H / sc, cx = clamp(this.a.x - vw / 2, 0, Math.max(0, AW - vw)), cy = clamp(this.a.y - vh / 2, 0, Math.max(0, AH - vh));

    drawGround(c, A, t); drawWalls(c, {walls: A.walls0});
    if(A.pen) drawPen(c, A.pen);
    for(const d of A.deco) drawDeco(c, d);
    for(const f of A.fix){ const n = this.fixN(f.id); drawFix2(c, f.label2 && n >= (f.need || 1) ? Object.assign({}, f, {label: f.label2}) : f, n, t); }
    const objs = this.objView(), npcs = this.npcView(), pa = this.partnerPos();
    for(const o of objs) if(!o.holder && !o.worn) drawObj2(c, o, t);
    const actors = [...npcs.map(n => ({y: n.y, f: () => drawNPC(c, n, LOOKS[n.look] || n.look, t)})), {y: this.a.y, f: () => drawAnimal(c, this.role, this.a, t, true)}];
    if(pa) actors.push({y: pa.y, f: () => drawAnimal(c, this.prole, pa, t, false)});
    actors.sort((p, q) => p.y - q.y).forEach(x => x.f());
    for(const o of objs){ if(o.worn){ const a = o.worn === this.role ? this.a : pa; if(a) drawWorn(c, o, a, o.worn); } else if(o.holder) drawObj2(c, o, t); }
    drawTrees(c, A, t);
    for(const n of npcs){ if(n.emo) drawEmote(c, n.x, n.y - 36, n.emo.e, t); if(n.bub) drawBubble(c, n.x, n.y - (n.emo ? 56 : 34), n.bub.txt); }

    drawName(c, this.a.x, this.a.y - 40, "You", "#FFE082");
    if(pa) drawName(c, pa.x, pa.y - 42, R.players?.[this.pp]?.name || PNAME[this.prole], "#FFFFFF");
  }

  /* overlays */
  toast(s){ const t = this.w.querySelector(".toast"); t.textContent = s; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); }
  banner(a, b){ const t = this.w.querySelector(".toast"); t.innerHTML = `<b>${esc(a)}</b>${b ? `<br>${esc(b)}` : ""}`; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show", "big"); }
  sheet(refresh){
    const sh = this.w.querySelector(".sheet"); this.sheetMode = "list"; const done = Object.assign({}, (R.done || {})[this.ai], this.host ? this.world.done : {});
    sh.innerHTML = `<div class="sheet-in"><h2>${esc(this.A.name)}</h2><p class="muted">🦒 Ginger · 🦛 Harriet · 🦒🦛 both · ✋ either</p><ul>${this.A.pranks.map(p => `<li class="${done[p.id] ? "done" : ""}"><span class="who">${ICON[p.who]}</span><span>${esc(p.text)}</span></li>`).join("")}</ul><button class="btn" data-x>Back to mischief</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden");
  }
  menu(){
    const sh = this.w.querySelector(".sheet"); this.sheetMode = "menu";
    sh.innerHTML = `<div class="sheet-in"><h2>Paused?</h2><p class="muted">Game code <b>${S.code}</b>. Progress saves automatically. Rejoin anytime with this code and your name.</p><h3>Sound</h3><div class="snd">${SND_CATS.map(([k, n]) => `<label><input type="checkbox" data-snd="${k}" ${sndOn(k) ? "checked" : ""}> ${n}</label>`).join("")}</div><button class="btn" data-x>Keep playing</button><button class="btn ghost" data-l>Leave game</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden"); sh.querySelector("[data-l]").onclick = leave;
    sh.querySelectorAll("[data-snd]").forEach(b => b.onchange = () => { setSnd(b.dataset.snd, b.checked); if(b.dataset.snd === "music" && b.checked) MUSIC.play(this.ai % TUNES.length); if(b.dataset.snd === "amb" && b.checked) AMB.play(this.A.amb); });
  }
}

/* iPhone: no long-press selection or menus during play */
document.addEventListener("contextmenu", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });
