/* ===================== drawing (flat, chunky, rounded) ===================== */
AREAS.splice(1); // 3D test copy: Area 1 only
function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function circ(c, x, y, r, fill, stroke, lw = 3){ c.beginPath(); c.arc(x, y, r, 0, 7); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
function ell(c, x, y, rx, ry, rot, fill, stroke, lw = 3){ c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); if(fill){ c.fillStyle = fill; c.fill(); } if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
const shadow = (c, x, y, rx, ry) => ell(c, x + 4, y + 6, rx, ry, 0, "rgba(46,42,58,.18)");
function hsh(i, k = 1){ const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); }

function drawGround(c, A, t){
  c.fillStyle = A.ground; c.fillRect(0, 0, AW, AH);
  for(let i = 0; i < 70; i++){ ell(c, hsh(i, 1) * AW, hsh(i, 2) * AH, 22 + hsh(i, 3) * 40, 12 + hsh(i, 4) * 20, 0, "rgba(255,255,255,.07)"); }
  for(let i = 0; i < 60; i++){ const x = hsh(i, 5) * AW, y = hsh(i, 6) * AH; c.fillStyle = ["#FFE066", "#FF8FAB", "#FFFFFF"][i % 3]; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); }
  for(const f of A.floors){ c.fillStyle = f[4]; rr(c, f[0], f[1], f[2], f[3], 14); c.fill(); }
  for(const w of A.water){
    const mud = w[4] === "mud"; c.fillStyle = mud ? PAL.mud : PAL.water; rr(c, w[0], w[1], w[2], w[3], 28); c.fill();
    c.strokeStyle = mud ? "#6D543B" : "#FFFFFF"; c.lineWidth = 6; c.stroke();
    c.save(); rr(c, w[0], w[1], w[2], w[3], 28); c.clip(); c.strokeStyle = mud ? PAL.mud2 : PAL.water2; c.lineWidth = 4;
    for(let k = 0; k < 9; k++){ const yy = w[1] + 20 + k * 46, ox = Math.sin(t * 1.4 + k) * 14; c.beginPath();
      for(let x = w[0] - 20; x < w[0] + w[2] + 20; x += 40) c.arc(x + ox, yy + (k % 2) * 8, 10, mud ? .2 : 3.6, mud ? 2.9 : 5.8); c.stroke(); }
    c.restore();
  }
}
function drawWalls(c, A){
  for(const w of A.walls){ c.fillStyle = PAL.wall; rr(c, w[0], w[1], w[2], w[3], 7); c.fill(); c.fillStyle = PAL.wallTop; rr(c, w[0] + 2, w[1] + 2, w[2] - 4, Math.max(4, w[3] - 9), 5); c.fill(); }
}
function drawTrees(c, A, t){
  for(const tr of A.trees){ const [x, y, r] = tr; shadow(c, x, y, r, r * .8); circ(c, x, y, r, "#4CAF50", "#2E7D32", 4); circ(c, x - r * .25, y - r * .3, r * .55, "#66BB6A");
    circ(c, x + r * .3, y + r * .2, r * .3, "#5DB561"); }
}

      if(!used) for(let k = 0; k < 4; k++) ell(c, x - 24 + k * 16, y, 9, 6, 0, ["#FFCA28", "#8BC34A", "#FF7043", "#4FC3F7"][k], PAL.ink, 2);
      else for(let k = 0; k < 4; k++) ell(c, x - 30 + k * 22, y + 40 + (k % 2) * 14, 9, 6, k, ["#FFCA28", "#8BC34A", "#FF7043", "#4FC3F7"][k], PAL.ink, 2); break;
    case "chair": shadow(c, x, y, 18, 10); rr(c, x - 16, y - 22, 32, 44, 6); c.fillStyle = "#FFFFFF"; c.fill(); c.strokeStyle = "#E53935"; c.lineWidth = 4; c.stroke(); break;
    case "lounger": rr(c, x - 22, y - 30, 44, 60, 10); c.fillStyle = "#FFB74D"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); break;
    case "towelrack": rr(c, x - 40, y - 6, 80, 12, 6); c.fillStyle = "#8D6E63"; c.fill(); break;
    case "gong": shadow(c, x, y, 20, 10); circ(c, x, y, 20, used ? "#FFD54F" : "#F9A825", PAL.ink, 3); circ(c, x, y, 8, "#FFE082"); break;
    case "table": shadow(c, x, y, f.r, f.r * .7); circ(c, x, y, f.r, "#FFFFFF", PAL.ink, 3); circ(c, x, y, f.r - 7, f.id === "ctable" ? "#FFCDD2" : "#FFF3E0"); break;

      else { c.beginPath(); c.moveTo(x - 42, y + 30); c.lineTo(x, y - 34); c.lineTo(x + 42, y + 30); c.closePath(); c.fillStyle = "#FF7043"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
        c.beginPath(); c.moveTo(x, y - 34); c.lineTo(x, y + 30); c.strokeStyle = "#BF360C"; c.stroke(); } break;
    case "fire": circ(c, x, y, 22, "#795548", PAL.ink, 3); if(!F.fireOut){ for(let k = 0; k < 3; k++){ const s = 1 + Math.sin(t * 9 + k) * .15; ell(c, x + (k - 1) * 7, y - 6, 7 * s, 14 * s, 0, ["#FF7043", "#FFCA28", "#FF5722"][k]); } }
      else for(let k = 0; k < 3; k++) circ(c, x + (k - 1) * 8, y - 10 - ((t * 20 + k * 9) % 30), 6, "rgba(200,200,200,.6)"); break;
    case "flagpole": c.strokeStyle = "#9E9E9E"; c.lineWidth = 5; c.beginPath(); c.moveTo(x, y + 10); c.lineTo(x, y - 60); c.stroke(); circ(c, x, y - 62, 5, "#FFD54F");
      if(!F.flagged){ c.fillStyle = "#42A5F5"; c.beginPath(); c.moveTo(x, y - 58); c.lineTo(x + 30, y - 50); c.lineTo(x, y - 42); c.fill(); } break;
    case "line": c.strokeStyle = "#ECEFF1"; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 60, y); c.lineTo(x + 60, y); c.stroke(); break;
    case "board": rr(c, x - 28, y - 22, 56, 44, 6); c.fillStyle = "#6D4C41"; c.fill(); rr(c, x - 22, y - 16, 44, 30, 4); c.fillStyle = "#FFF8E1"; c.fill(); break;
    case "jeep": if(f.r) drawJeep(c, x, y, "#558B2F", 0); else { drawJeep(c, x, y, "#558B2F", 0); c.fillStyle = "#FFFFFF"; c.font = "bold 13px Fredoka, sans-serif"; c.textAlign = "center"; c.fillText("ESCAPE", x, y - 46); } break;
    case "bell": shadow(c, x, y, 26, 12); rr(c, x - 34, y + 10, 68, 12, 4); c.fillStyle = "#8D6E63"; c.fill();
      c.save(); c.translate(x, y); c.rotate(used ? Math.sin(t * 10) * .4 : 0); c.beginPath(); c.moveTo(-18, 10); c.quadraticCurveTo(-18, -24, 0, -24); c.quadraticCurveTo(18, -24, 18, 10); c.closePath();
      c.fillStyle = "#FFC107"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); c.restore(); break;
    case "mic": c.strokeStyle = PAL.ink; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y + 14); c.lineTo(x, y - 6); c.stroke(); ell(c, x, y - 12, 7, 10, 0, "#616161", PAL.ink, 2); break;
    case "desk": rr(c, x - 40, y - 24, 80, 48, 8); c.fillStyle = "#8D6E63"; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke(); break;
  }
}
function drawJeep(c, x, y, col, rot){
  c.save(); c.translate(x, y); c.rotate(rot); shadow(c, 0, 0, 30, 46);
  for(const [dx, dy] of [[-26, -26], [26, -26], [-26, 26], [26, 26]]) { rr(c, dx - 6, dy - 11, 12, 22, 4); c.fillStyle = PAL.ink; c.fill(); }
  rr(c, -24, -40, 48, 80, 12); c.fillStyle = col; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 3; c.stroke();
  rr(c, -18, -30, 36, 16, 5); c.fillStyle = "#B3E5FC"; c.fill(); rr(c, -18, 0, 36, 30, 6); c.fillStyle = "#33691E"; c.fill(); c.restore();
}

/* ===================== geometry ===================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    for(const f of A.fixtures) if(f.solid) pushOutCircle(p, rad, f.x, f.y, f.r);
    if(objs) for(const o of objs) if(o.heavy && !o.gone) pushOutCircle(p, rad, o.x, o.y, o.r);

    for(const w of A.walls) if(x > w[0] - 13 && x < w[0] + w[2] + 13 && y > w[1] - 13 && y < w[1] + w[3] + 13) b = 1;
    for(const t of A.trees) if(Math.hypot(x - t[0], y - t[1]) < t[2] * .7 + 12) b = 1;
    for(const f of A.fixtures) if(f.solid && Math.hypot(x - f.x, y - f.y) < f.r + 12) b = 1;
    for(const w of A.water) if(w[4] !== "mud" && inRect(x, y, w)) b = 1;
    g[j * gw + i] = b;
  }
  return {C, gw, gh, g};
}
function nearFree(G, i, j){
  if(i >= 0 && j >= 0 && i < G.gw && j < G.gh && !G.g[j * G.gw + i]) return [i, j];
  for(let r = 1; r < 12; r++) for(let dj = -r; dj <= r; dj++) for(let di = -r; di <= r; di++){
    const a = i + di, b = j + dj; if(a >= 0 && b >= 0 && a < G.gw && b < G.gh && !G.g[b * G.gw + a]) return [a, b]; }
  return [i, j];
}
function findPath(G, sx, sy, tx, ty){
  const C = G.C, [si, sj] = nearFree(G, Math.floor(sx / C), Math.floor(sy / C)), [ti, tj] = nearFree(G, Math.floor(tx / C), Math.floor(ty / C));
  const N = G.gw * G.gh, start = sj * G.gw + si, goal = tj * G.gw + ti;
  const gs = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N), open = [start]; gs[start] = 0;
  const h = k => Math.hypot(k % G.gw - ti, Math.floor(k / G.gw) - tj);
  let it = 0;
  while(open.length && it++ < 4000){
    let bi = 0, bf = 1e9; for(let q = 0; q < open.length; q++){ const f = gs[open[q]] + h(open[q]); if(f < bf){ bf = f; bi = q; } }
    const cur = open.splice(bi, 1)[0]; if(cur === goal) break; if(closed[cur]) continue; closed[cur] = 1;
    const ci = cur % G.gw, cj = Math.floor(cur / G.gw);
    for(let dj = -1; dj <= 1; dj++) for(let di = -1; di <= 1; di++){
      if(!di && !dj) continue; const a = ci + di, b = cj + dj; if(a < 0 || b < 0 || a >= G.gw || b >= G.gh) continue;
      const k = b * G.gw + a; if(G.g[k] || closed[k]) continue;
      if(di && dj && (G.g[cj * G.gw + a] || G.g[b * G.gw + ci])) continue;
      const ng = gs[cur] + (di && dj ? 1.414 : 1); if(ng < gs[k]){ gs[k] = ng; from[k] = cur; open.push(k); }
    }
  }
  if(from[goal] < 0 && goal !== start) return [{x: tx, y: ty}];
  const pts = []; for(let k = goal; k !== start && k >= 0; k = from[k]) pts.push({x: (k % G.gw) * C + C / 2, y: Math.floor(k / G.gw) * C + C / 2});
  pts.reverse(); const out = pts.filter((_, i) => i % 2 === 1 || i === pts.length - 1); out.push({x: tx, y: ty}); return out;
}

  mountedKey = "home"; stopPlay(); app.innerHTML = "";
  const w = el(`<div class="home"><h1 class="logo"><span>Safari</span><span>Mischief</span></h1><p class="tag"><b>3D test copy</b>: Area 1 only. Saves separately from the real game.</p><p class="tag">Two troublemakers. One very nice lodge.</p>
    <div class="card"><input id="nm" placeholder="Your name" maxlength="12" autocomplete="off">
    <button class="btn" data-a="make">New game · you're Ginger 🦒</button>
    <div class="row"><input id="cd" placeholder="CODE" maxlength="4" autocomplete="off"><button class="btn alt" data-a="join">Join · Harriet 🦛</button></div>
    <p class="err"></p></div>
    <button class="btn ghost" data-a="sound">🔊 Sound settings</button><div class="sheet hidden"></div>
    <div class="card how"><b>How to play</b><p>Work through the lodge's to-do list of pranks together. Ginger stretches her neck to reach high things. Harriet charges, pushes heavy stuff and makes huge splashes. Get caught holding something and they'll chase you off and take it back.</p></div></div>`);
  app.append(w);
  w.querySelector("[data-a=sound]").onclick = () => { ac(); const sh = w.querySelector(".sheet"); sh.innerHTML = `<div class="sheet-in"><h2>Sound settings</h2><div class="sndpanel">${soundPanelHTML()}</div><button class="btn" data-x>Done</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden"); bindSoundPanel(sh); };
  const nm = w.querySelector("#nm"), cd = w.querySelector("#cd"), err = w.querySelector(".err");
  nm.value = localStorage.getItem("safari_name") || "";
  const qs = new URLSearchParams(location.search).get("g"); if(qs) cd.value = qs.toUpperCase();
  const name = () => { const n = nm.value.trim(); if(!n){ err.textContent = "Enter your name first."; return null; } if(!isCleanText(n)){ err.textContent = "Pick a different name."; return null; } localStorage.setItem("safari_name", n); return n; };
  const makeGame = async (startArea = 0, test = false) => { const n = name(); if(!n) return; ac(); err.textContent = "Creating…";
    try{ const L = "ABCDEFGHJKMNPQRSTUVWXYZ"; let code;
      for(let i = 0; i < 12; i++){ code = [...Array(4)].map(() => L[rnd(L.length)]).join(""); if(!isClean(code)) continue; if(!(await api.get(rid(code)))) break; }
      await api.update(rid(code), {created: Date.now(), phase: "lobby", "players/p1": {name: n}, area: startArea, test: test || null});
      S = {code, pid: "p1", name: n}; saveS(); connect();
    }catch(e){ err.textContent = "Couldn't connect: " + (e.code || e.message); } };
  w.querySelector("[data-a=make]").onclick = () => makeGame(0);
  // hidden test menu: tap the title 5 times within 3 seconds
  let taps = [];
  w.querySelector(".logo").onclick = () => { const now = Date.now(); taps = taps.filter(t => now - t < 3000); taps.push(now); if(taps.length < 5) return; taps = [];
    const sh = w.querySelector(".sheet");
    sh.innerHTML = `<div class="sheet-in"><h2>🧪 Test menu</h2><p class="muted small">Start a test game at any area. Your partner joins with the code as usual. Enter your name on the main screen first.</p>
      <div class="tests">${AREAS.map((a, i) => `<button class="btn alt" data-t="${i}">${i + 1}. ${esc(a.name)}</button>`).join("")}
      <button class="btn alt" data-jeep>🚙 Jeep escape</button></div><button class="btn" data-x>Close</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden");
    sh.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { sh.classList.add("hidden"); makeGame(+b.dataset.t, true); });
    sh.querySelector("[data-jeep]").onclick = () => { sh.classList.add("hidden"); makeGame(0, "jeep"); }; };
  w.querySelector("[data-a=join]").onclick = async () => { const n = name(); if(!n) return; ac(); const code = cd.value.trim().toUpperCase(); if(code.length !== 4){ err.textContent = "Enter the 4-letter code."; return; }
    err.textContent = "Joining…";
    try{ const g = await api.get(rid(code)); if(!g){ err.textContent = "No game with that code."; return; }
      let pid = null; if(!g.players?.p2) pid = "p2"; else if(g.players.p2.name === n) pid = "p2"; else if(g.players.p1?.name === n) pid = "p1";
      if(!pid){ err.textContent = "That game already has two players."; return; }
      const patch = {}; if(!g.players?.[pid]) patch["players/" + pid] = {name: n}; if(g.phase === "lobby") patch.phase = g.test === "jeep" ? "jeep" : "play"; if(Object.keys(patch).length) await api.update(rid(code), patch);
      S = {code, pid, name: n}; saveS(); connect();
    }catch(e){ err.textContent = "Couldn't connect: " + (e.code || e.message); } };
}
function connect(){
  if(unsub) unsub(); mountedKey = "";
  unsub = api.listen(rid(S.code), v => { if(!S) return; if(!v){ leave(); return; } R = v; render(); });
}
function leave(){ if(unsub) unsub(); unsub = null; stopPlay(); S = null; R = null; SS.removeItem("safari3d_s"); homeScreen(); }
function render(){
  if(!R) return;
  if(R.phase === "lobby") return lobbyScreen();
  if(R.phase === "won") return wonScreen();
  if(R.phase === "jeep") return jeepScreen();
  playScreen();
}
function lobbyScreen(){
  if(mountedKey === "lobby") return; mountedKey = "lobby"; stopPlay(); app.innerHTML = "";
  const url = location.origin + location.pathname + "?g=" + S.code;
  const w = el(`<div class="home"><h1 class="logo small"><span>Safari</span><span>Mischief</span></h1><div class="card center"><p>Your code</p><div class="code">${S.code}</div>
    <p class="muted">Send this to your partner. They'll play Harriet 🦛.</p><button class="btn alt" data-a="inv">Send invite</button>
    <p class="muted">Waiting for Harriet…</p><button class="btn ghost" data-a="leave">Leave</button></div></div>`);
  app.append(w);
  w.querySelector("[data-a=inv]").onclick = () => { if(navigator.share) navigator.share({title: "Safari Mischief", text: "Join my Safari Mischief game: " + S.code, url}).catch(() => {}); else navigator.clipboard?.writeText(url).then(() => w.querySelector("[data-a=inv]").textContent = "Link copied"); };
  w.querySelector("[data-a=leave]").onclick = leave;
}
function wonScreen(){
  if(mountedKey === "won") return; mountedKey = "won"; stopPlay(); app.innerHTML = "";
  const w = el(`<div class="home"><h1 class="logo small"><span>Lodge</span><span>Wrecked!</span></h1><div class="card center"><p class="big">🦒🦛</p>
    <p>${R.wild ? "They made it out. Ginger and Harriet are back in the wild, and the lodge will never be the same." : "Every prank, every area. The safari lodge will never be the same."}</p>${galleryHTML()}
    ${S.pid === "p1" ? `<button class="btn" data-a="again">Play again from the start</button>` : `<p class="muted">Ginger can start a new run.</p>`}<button class="btn ghost" data-a="leave">Leave</button></div></div>`);
  app.append(w);
  const a = w.querySelector("[data-a=again]"); if(a) a.onclick = () => api.update(rid(S.code), {phase: "play", area: 0, done: null});
  w.querySelector("[data-a=leave]").onclick = leave;
}

function galleryHTML(ai){ let g = []; try{ g = JSON.parse(localStorage.getItem("safari_gallery_" + S.code) || "[]"); }catch{} if(ai != null) g = g.filter(x => x.a === ai);
  if(!g.length) return ""; return `<div class="gal"><b>📸 Photobombs</b><div>${g.slice(-12).map(x => `<img src="${x.img}" alt="photobomb">`).join("")}</div></div>`; }
/* ---------- play ---------- */
function stopPlay(){ if(PLAY){ PLAY.stop(); PLAY = null; } }
function playScreen(){
  const key = "play" + S.code + ":" + R.area;
  if(mountedKey === key){ PLAY?.onState(); return; }
  mountedKey = key; stopPlay(); app.innerHTML = "";
  const role = ROLE[S.pid], A = AREAS[R.area];
  const w = el(`<div class="play">
    <div class="hud"><button class="hb" data-a="menu">☰</button><div class="area"><b>${esc(A.name)}</b><span data-cnt></span></div><button class="hb list" data-a="list">📋 List</button></div>
    <div class="stage"><canvas></canvas><div class="toast"></div><div class="wait"></div></div>
    <div class="ctrl"><div class="joy"><div class="knob"></div></div>
      <div class="btns"><button class="pad grab">GRAB</button><button class="pad noise">${role === "G" ? "SNORT" : "BELLOW"}</button><button class="pad spec">${role === "G" ? "STRETCH" : "CHARGE"}</button><button class="pad sit">SIT</button><button class="pad sneak">SNEAK</button><button class="pad run">RUN</button></div></div>

function m3(c, o){ const k = c + (o ? JSON.stringify(o) : ""); return MATS[k] || (MATS[k] = new THREE.MeshLambertMaterial(Object.assign({color: c, flatShading: true}, o || {}))); }
function msh(geo, c, o){ const m = new THREE.Mesh(geo, m3(c, o)); m.castShadow = true; m.receiveShadow = true; return m; }
const B3 = (w, h, d, c, o) => msh(new THREE.BoxGeometry(w, h, d), c, o);
const C3 = (rt, rb, h, c, seg = 10, o) => msh(new THREE.CylinderGeometry(rt, rb, h, seg), c, o);

const SC3 = (m, x, y, z) => { m.scale.set(x, y, z); return m; };
function G3(...k){ const g = new THREE.Group(); k.forEach(x => x && g.add(x)); return g; }
function texCanvas(w, h, f){ const c = document.createElement("canvas"); c.width = w; c.height = h; f(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
function label3(txt, w, h, fg = "#4E342E", bg = "#FFF3E0", font = "bold 46px Fredoka, sans-serif"){
  const t = texCanvas(512, Math.round(512 * h / w), (c, W, H) => { c.fillStyle = bg; c.fillRect(0, 0, W, H); c.strokeStyle = fg; c.lineWidth = 10; c.strokeRect(5, 5, W - 10, H - 10);
    c.fillStyle = fg; c.font = font; c.textAlign = "center"; c.textBaseline = "middle"; let fs = 46; while(c.measureText(txt).width > W - 40 && fs > 16){ fs -= 4; c.font = font.replace(/\d+px/, fs + "px"); } c.fillText(txt, W / 2, H / 2 + 2); });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map: t, transparent: true}));
}
function hsh3(i){ const s = Math.sin(i * 91.7 + 13.1) * 43758.5; return s - Math.floor(s); }
function strHash(s){ let h = 0; for(const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }

      ${g || `<p class="muted">No photobombs in this area.</p>`}
      <button class="btn" data-n>${last ? "Steal a jeep and escape!" : "Next: " + esc(AREAS[nx].name)}</button></div></div>`);
    c.querySelector("[data-n]").onclick = e => { e.target.disabled = true; e.target.textContent = "Loading…";
      api.tx(rid(S.code), cur => { if(cur.area !== ai || cur.phase !== "play") return false; if(last) cur.phase = "jeep"; else cur.area = nx; }).catch(() => { e.target.disabled = false; e.target.textContent = "Try again"; }); };
    this.w.append(c);
  }
  menu(){
    const sh = this.w.querySelector(".sheet"); this.sheetMode = "menu";
    sh.innerHTML = `<div class="sheet-in"><h2>Paused?</h2><p class="muted">Game code <b>${S.code}</b>. Progress saves automatically. Rejoin anytime with this code and your name.</p><div data-goto></div><div class="sndpanel">${soundPanelHTML()}</div><button class="btn" data-x>Keep playing</button><button class="btn ghost" data-l>Leave game</button><button class="btn ghost" data-reset>↺ Reset objects (keeps your pranks)</button><button class="btn ghost" data-skip>⏭ Skip this area</button></div>`;
    sh.classList.remove("hidden"); sh.querySelector("[data-x]").onclick = () => sh.classList.add("hidden"); sh.querySelector("[data-l]").onclick = leave;
    sh.querySelector("[data-reset]").onclick = () => { if(!confirm("Put every object and person back where they started? Finished pranks stay finished.")) return; sh.classList.add("hidden"); api.update(rid(S.code), {reset: {a: this.ai, t: Date.now()}}).catch(() => {}); };
    sh.querySelector("[data-skip]").onclick = () => { const ai = this.ai, nx = nextArea(ai), last = nx < 0; if(!confirm(last ? "Skip to the jeep escape?" : `Skip ${this.A.name} and go to ${AREAS[nx].name}?`)) return; sh.classList.add("hidden");
      api.tx(rid(S.code), cur => { if(cur.area !== ai || cur.phase !== "play") return false; if(last) cur.phase = "jeep"; else cur.area = nx; }).catch(() => {}); };
    const go = sh.querySelector("[data-goto]"); if(go) go.innerHTML = `<p class="muted" style="margin:10px 0 4px">Go to an area</p>` + ORDER().map(i => `<button class="btn ghost" data-ai="${i}"${i === this.ai ? " disabled" : ""}>Area ${areaNo(i)} · ${esc(AREAS[i].name)}</button>`).join("") + `<button class="btn ghost" data-ai="jeep">🚙 Jeep escape</button>`;
    sh.querySelectorAll("[data-ai]").forEach(b => b.onclick = () => { const v = b.dataset.ai, ai = this.ai; if(!confirm(v === "jeep" ? "Go to the jeep escape?" : `Go to Area ${areaNo(+v)} · ${AREAS[+v].name}?`)) return; sh.classList.add("hidden");
      api.tx(rid(S.code), cur => { if(cur.area !== ai || cur.phase !== "play") return false; if(v === "jeep") cur.phase = "jeep"; else cur.area = +v; }).catch(() => {}); });
    bindSoundPanel(sh, (k, on) => { if(k === "music" && on) MUSIC.play(this.ai % TUNES.length); if(k === "amb" && on) AMB.play(this.A.amb); });
  }
}

/* iPhone: no long-press selection or menus during play */
document.addEventListener("contextmenu", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });
document.addEventListener("selectstart", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });
document.addEventListener("touchstart", e => { if(e.target.closest && e.target.closest(".pad, .joy, canvas")) e.preventDefault(); }, {passive: false});

if(S) connect(); else homeScreen();
/* never fail silently on the start screen; no long-press menus during play */
window.addEventListener("unhandledrejection", e => { const el = document.querySelector(".err"); if(el && el.isConnected) el.textContent = "Couldn't connect: " + (e.reason && (e.reason.code || e.reason.message) || e.reason); });
document.addEventListener("contextmenu", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });
document.addEventListener("selectstart", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });

</script></body></html>
